<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>トーナメント管理システム – 転送中…</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
    background:#0e1116;color:#e6edf3}
  .box{text-align:center;line-height:1.8}
  .sp{display:inline-block;width:26px;height:26px;border:3px solid #2a323d;border-top-color:#4c8dff;
    border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}
  @keyframes spin{to{transform:rotate(360deg)}}
  a{color:#4c8dff}
  .muted{color:#8b97a6;font-size:13px}
</style>
</head>
<body>
  <div class="box">
    <div class="sp"></div><br>
    トーナメント管理システムへ転送中…<br>
    <span class="muted">自動で開かない場合は <a id="manual" href="#">こちらをタップ</a></span>
  </div>
<script>
/* GASウェブアプリ(/exec)への転送ページ。
   このページに付いたクエリ(?doc=XXX&board など)とハッシュ(#admin 等)を
   そのままGAS側へ引き継ぐので、どの大会・どのモードのURLも短縮できる。
   例)  https://sin1.studio/serval/go/?doc=sin1cup        （閲覧）
        https://sin1.studio/serval/go/?doc=sin1cup&admin  （管理者）
        https://sin1.studio/serval/go/?doc=sin1cup&board  （別画面）  */
(function(){
  var GAS = 'https://script.google.com/macros/s/AKfycbzXFILgMw74O--NsyLo9_nRxIxkwk1pUDGjh8Uwpw2p1StTMaj4o9jPEXncBfHuobR0bQ/exec';
  var target = GAS + (location.search || '') + (location.hash || '');
  document.getElementById('manual').href = target;
  // replace で履歴を残さない（戻るでこの中継ページに戻らないように）
  location.replace(target);
})();
</script>
</body>
</html>
