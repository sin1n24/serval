<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>serval — トーナメント管理システム</title>
<link rel="icon" href="serval.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0D141F; --panel:#16202E; --panel2:#1B2736; --line:#263447;
    --serval:#E9A93D; --serval-dim:#8A6B2E;
    --text:#E8EDF4; --muted:#8A97A8; --danger:#E05B5B; --ok:#5BBB7B;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --disp:'Zen Kaku Gothic New',system-ui,sans-serif;
    --shadow:rgba(0,0,0,.4);
  }
  [data-theme="light"]{
    --night:#F0F2F5; --panel:#FFFFFF; --panel2:#F5F6FA; --line:#DDE2EA;
    --serval:#C57C0E; --serval-dim:#A86A0C;
    --text:#1A2230; --muted:#5B6778; --danger:#C0392B; --ok:#27AE60;
    --shadow:rgba(0,0,0,.12);
  }
  *{box-sizing:border-box; margin:0}
  html,body{min-height:100%}
  body{
    background:var(--night); color:var(--text);
    font-family:var(--disp); font-weight:500; font-size:14px; line-height:1.6;
    transition:background .25s,color .25s;
  }
  .wrap{max-width:880px; margin:0 auto; padding:32px 20px 100px}

  /* ── 上部ナビ（取説と共通の帯） ── */
  .topnav{
    position:sticky; top:0; z-index:10;
    background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:14px; padding:10px 20px;
  }
  .topnav .brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text)}
  .topnav .brand img{width:28px; height:28px; object-fit:contain}
  [data-theme="dark"] .topnav .brand img{filter:invert(1); opacity:.9}
  .topnav .brand-name{font-weight:700; font-size:15px; letter-spacing:.1em}
  .topnav .brand-sub{font-family:var(--mono); font-size:10px; color:var(--muted); letter-spacing:.2em}
  .topnav .sp{flex:1}
  .back-link{
    font-size:12px; font-family:var(--mono); color:var(--muted); text-decoration:none;
    letter-spacing:.05em; padding:6px 10px; border:1px solid var(--line); border-radius:7px;
  }
  .back-link:hover{color:var(--text); border-color:var(--serval-dim)}
  #themeBtn{
    display:flex; align-items:center; justify-content:center;
    width:32px; height:32px; padding:0; border-radius:50%;
    background:transparent; border:1px solid var(--line); cursor:pointer;
    font-size:15px; font-family:inherit;
  }
  #themeBtn:hover{border-color:var(--serval-dim)}

  /* ── ヒーロー ── */
  .hero{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:20px 24px; margin:18px 0 28px;
  }
  .hero-desc{font-size:13.5px; color:var(--muted); line-height:1.75}
  .hero-desc strong{color:var(--text); font-weight:700}

  .section-title{
    font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.22em; text-transform:uppercase;
    margin-bottom:14px; display:flex; align-items:center; gap:8px;
  }
  .section-title::after{content:''; flex:1; height:1px; background:var(--line)}

  .toolbar{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap}
  .toolbar .sp{flex:1}

  /* ── ボタン ── */
  button{
    font-family:var(--disp); font-weight:700; font-size:13px; cursor:pointer;
    border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--text);
    padding:8px 16px; transition:border-color .15s,background .15s;
  }
  button:hover{border-color:var(--serval-dim)}
  button:focus-visible{outline:2px solid var(--serval); outline-offset:2px}
  button.primary{background:var(--serval); border-color:var(--serval); color:#151004}
  button.primary:hover{filter:brightness(1.1)}
  button.ghost{background:transparent; border-color:transparent; color:var(--muted); font-weight:500; padding:6px 10px}
  button.ghost:hover{color:var(--text); border-color:var(--line)}
  button.danger{color:var(--danger)}
  button.sm{font-size:12px; padding:5px 10px}
  button:disabled{opacity:.45; cursor:default}
  a.btnlike{
    display:inline-block; text-decoration:none; font-weight:700; font-size:13px;
    border:1px solid var(--line); border-radius:8px; background:var(--panel2); color:var(--text);
    padding:6px 13px; transition:border-color .15s;
  }
  a.btnlike:hover{border-color:var(--serval-dim)}
  a.btnlike.primary{background:var(--serval); border-color:var(--serval); color:#151004}
  a.btnlike.outline{border-color:var(--line)}

  /* ── ブックカード ── */
  .book-card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    margin-bottom:14px; overflow:hidden; box-shadow:0 2px 8px var(--shadow);
    animation:cardIn .35s ease both;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.book-card{animation:none}}
  .book-card.deleted{opacity:.5}
  .book-header{
    display:flex; align-items:center; gap:10px; padding:14px 18px;
    border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  .status-dot{
    width:10px; height:10px; border-radius:50%; flex-shrink:0;
    background:var(--serval);
  }
  .status-dot.pending{background:var(--line)}
  .book-name{font-size:18px; font-weight:700; flex:1; min-width:100px}
  .book-id{font-family:var(--mono); font-size:10px; color:var(--muted)}
  .book-note{font-size:12.5px; color:var(--muted); margin-top:1px}
  .book-meta{flex:1}
  .book-actions{display:flex; gap:6px; align-items:center; flex-shrink:0}

  /* ── トーナメント一覧 ── */
  .tournament-list{padding:0 18px 12px}
  .tournament-row{
    display:flex; align-items:center; gap:10px; padding:9px 0;
    border-bottom:1px solid var(--panel2); flex-wrap:wrap;
  }
  .tournament-row:last-child{border-bottom:none}
  .t-page{
    font-family:var(--mono); font-size:11.5px; font-weight:500;
    background:rgba(233,169,61,.15); border:1px solid var(--serval-dim);
    border-radius:5px; padding:2px 9px; color:var(--serval); white-space:nowrap; flex-shrink:0;
  }
  .t-key{font-family:var(--mono); font-size:11px; color:var(--muted); flex:1; min-width:80px}
  .t-champion{font-size:12px; color:var(--text); flex:1; min-width:90px}
  .t-runner{font-size:12px; color:var(--muted); flex:1; min-width:90px}
  .t-champion-empty,.t-runner-empty{opacity:.5; font-style:italic}
  .t-note{font-size:12px; color:var(--muted); flex:1}
  .t-note-empty{opacity:.5; font-style:italic}
  .t-btns{display:flex; gap:6px; flex-shrink:0}

  /* 「トーナメントを追加」行 */
  .add-row{
    display:flex; align-items:center; gap:8px; padding:10px 18px 14px;
    border-top:1px solid var(--panel2);
  }
  .add-row input{
    background:var(--night); border:1px solid var(--line); border-radius:7px;
    color:var(--text); font-family:var(--mono); font-size:12.5px; padding:6px 9px;
  }
  .add-row input:focus-visible{outline:2px solid var(--serval); outline-offset:1px; border-color:var(--serval-dim)}
  .add-row .inp-page{width:150px}
  .add-row .inp-key{flex:1; min-width:80px; max-width:200px}
  .add-row label{font-size:11px; color:var(--muted); white-space:nowrap}
  .add-row-inner{display:flex; align-items:center; gap:8px; flex:1; flex-wrap:wrap}
  .key-warn{flex-basis:100%; font-size:11px; color:var(--danger); margin-top:2px; display:none}
  .key-warn.show{display:block}

  /* 空状態・準備中 */
  .no-tournaments{
    padding:14px 18px; font-size:13px; color:var(--muted);
    border-top:1px solid var(--panel2);
  }
  .setup{
    background:var(--panel2); border:1px dashed var(--serval-dim); border-radius:9px;
    padding:12px 14px; margin:12px 18px 0; font-size:12.5px;
  }
  .setup b{color:var(--serval); font-weight:700}
  .setup ol{margin:6px 0 0 18px; padding:0}
  .setup li{margin-bottom:3px}
  .setup code{font-family:var(--mono); font-size:11px; background:var(--night); border-radius:4px; padding:1px 5px}

  .empty{text-align:center; padding:70px 20px; color:var(--muted); border:1px dashed var(--line); border-radius:12px}
  .empty img{width:64px; margin-bottom:14px; opacity:.4}
  [data-theme="dark"] .empty img{filter:invert(1)}
  .empty p{margin-bottom:18px}
  .del-tag{font-family:var(--mono); font-size:10px; color:var(--danger); border:1px solid var(--danger); border-radius:4px; padding:1px 6px}

  /* ── ブック編集モーダル ── */
  dialog{
    background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:14px;
    padding:24px; width:min(540px,calc(100vw - 32px)); font-family:var(--disp);
    box-shadow:0 8px 40px var(--shadow);
  }
  dialog::backdrop{background:rgba(5,9,14,.72)}
  dialog h2{font-size:16px; font-weight:700; margin-bottom:18px}
  label.lbl{display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px; letter-spacing:.05em}
  input[type=text],input[type=url]{
    width:100%; background:var(--night); border:1px solid var(--line); border-radius:7px;
    color:var(--text); font-family:var(--disp); font-size:14px; padding:8px 10px;
  }
  input:focus-visible{outline:2px solid var(--serval); outline-offset:1px; border-color:var(--serval-dim)}
  input.mono{font-family:var(--mono); font-size:12px}
  .fld{margin-bottom:16px}
  .fld .hint{font-size:11px; color:var(--muted); margin-top:3px}
  .modal-foot{display:flex; gap:10px; justify-content:flex-end; margin-top:22px}

  /* ── トースト ── */
  #toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:var(--panel2); border:1px solid var(--line); border-radius:9px;
    padding:9px 20px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s;
    max-width:min(520px,calc(100vw - 40px)); box-shadow:0 4px 20px var(--shadow);
  }
  #toast.show{opacity:1}
  #toast.err{border-color:var(--danger); color:#F2A9A9}
  .loading{text-align:center; color:var(--muted); padding:60px 0; font-family:var(--mono); font-size:12px; letter-spacing:.2em}

  /* ── スクリーンショットプレビュー ── */
  .preview-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:32px}
  @media(max-width:600px){.preview-grid{grid-template-columns:1fr}}
  .preview-item{display:flex; flex-direction:column; gap:8px}
  .preview-label{
    font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
    color:var(--muted); display:flex; align-items:center; gap:7px;
  }
  .preview-label .dot{
    width:8px; height:8px; border-radius:50%; background:var(--serval); flex-shrink:0;
  }
  .preview-label .dot.view{background:var(--ok)}
  .preview-img-wrap{
    border:1px solid var(--line); border-radius:10px; overflow:hidden;
    background:var(--panel2); box-shadow:0 4px 16px var(--shadow);
    cursor:zoom-in; transition:border-color .15s;
  }
  .preview-img-wrap:hover{border-color:var(--serval-dim)}
  .preview-img-wrap img{width:100%; display:block; height:180px; object-fit:cover; object-position:top}
  /* ライトボックス */
  #lb{
    display:none; position:fixed; inset:0; z-index:1000;
    background:rgba(5,9,14,.88); align-items:center; justify-content:center; cursor:zoom-out;
  }
  #lb.open{display:flex}
  #lb img{max-width:min(1100px,96vw); max-height:92vh; border-radius:10px; border:1px solid var(--line); box-shadow:0 8px 48px rgba(0,0,0,.7)}
  #lb-close{
    position:fixed; top:18px; right:22px; background:var(--panel); border:1px solid var(--line);
    border-radius:50%; width:36px; height:36px; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--text);
  }
</style>
</head>
<body>

<!-- 上部ナビ（取説と共通の帯） -->
<nav class="topnav">
  <a class="brand" href="./">
    <img src="serval.png" alt="serval">
    <div>
      <div class="brand-name">serval</div>
      <div class="brand-sub">TOURNAMENT MANAGER</div>
    </div>
  </a>
  <span class="sp"></span>
  <a class="back-link" href="manual/">📖 取扱説明書</a>
  <button id="themeBtn" aria-label="テーマ切り替え">🌙</button>
</nav>

<div class="wrap">

  <div class="hero">
    <div class="hero-desc">
      <strong>serval</strong> はロボット競技向けの<strong>トーナメント・リーグ管理システム</strong>です。
      大会シリーズ（<strong>ブック</strong>）ごとにGASプロジェクトを用意し、第1回・第2回…の各<strong>トーナメント</strong>を一元管理します。
    </div>
  </div>

  <div class="preview-grid">
    <div class="preview-item">
      <div class="preview-label"><span class="dot view"></span>閲覧画面</div>
      <div class="preview-img-wrap" onclick="openLb('img/screenshot-view.png')" title="クリックで拡大">
        <img src="img/screenshot-view.png" alt="閲覧画面のスクリーンショット" loading="lazy">
      </div>
    </div>
    <div class="preview-item">
      <div class="preview-label"><span class="dot"></span>管理画面</div>
      <div class="preview-img-wrap" onclick="openLb('img/screenshot-admin.png')" title="クリックで拡大">
        <img src="img/screenshot-admin.png" alt="管理画面のスクリーンショット" loading="lazy">
      </div>
    </div>
  </div>

  <!-- ライトボックス -->
  <div id="lb" onclick="closeLb()">
    <button id="lb-close" onclick="closeLb()">✕</button>
    <img id="lb-img" src="" alt="">
  </div>

  <div class="section-title">ブック一覧</div>

  <div class="toolbar">
    <button class="primary" id="btnNew">＋ 新規ブック</button>
    <span class="sp"></span>
    <label style="display:flex;align-items:center;gap:6px;margin:0;cursor:pointer;font-size:12px">
      <input type="checkbox" id="chkDeleted">削除済みも表示
    </label>
    <button class="ghost" id="btnReload" title="再読み込み">↻</button>
  </div>

  <div id="list"><div class="loading">LOADING…</div></div>

</div>

<!-- ブック編集モーダル -->
<dialog id="bookDlg">
  <h2 id="bookDlgTitle">ブックを編集</h2>
  <div class="fld">
    <label class="lbl" for="fName">ブック名（大会シリーズ名）</label>
    <input type="text" id="fName" maxlength="100" placeholder="中島杯">
  </div>
  <div class="fld">
    <label class="lbl" for="fUrl">GAS WebアプリURL（/exec）</label>
    <input type="url" id="fUrl" class="mono" placeholder="https://script.google.com/macros/s/…/exec">
    <div class="hint">通常は既定値のまま（短縮リンク go/ 経由）でOK。個別GASを使う場合のみ /exec URLに差し替えます。空のままなら「準備中」扱い。</div>
  </div>
  <div class="fld">
    <label class="lbl" for="fNote">メモ（任意）</label>
    <input type="text" id="fNote" maxlength="200" placeholder="担当者・連絡先など">
  </div>
  <div class="modal-foot">
    <button id="btnBookCancel">キャンセル</button>
    <button class="primary" id="btnBookSave">保存</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
var API_BASE='https://script.google.com/macros/s/AKfycbxXvPz1A_5MO08BFpvye_sYMUi5ho8QL1jokvem48ii5Q0rQZ4Ja_1_nIXxzzSLbWhdVA/exec';
var GO_URL='https://sin1.studio/serval/go/';
var TOKEN_KEY='servalPortalToken';
var _books=[];
var _editingBook=null;

/* ── テーマ ── */
(function(){
  var s=localStorage.getItem('servalTheme')||'dark';
  document.documentElement.setAttribute('data-theme',s);
  document.getElementById('themeBtn').textContent=s==='dark'?'🌙':'☀️';
})();
document.getElementById('themeBtn').onclick=function(){
  var c=document.documentElement.getAttribute('data-theme');
  var n=c==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',n);
  localStorage.setItem('servalTheme',n);
  this.textContent=n==='dark'?'🌙':'☀️';
};

/* ── ユーティリティ ── */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function toast(msg,isErr){
  var t=document.getElementById('toast');
  t.textContent=msg; t.className='show'+(isErr?' err':'');
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.className='';},3200);
}

function apiGetList(){
  return fetch(API_BASE+'?api=booklist&deleted=1').then(function(r){return r.json();});
}
function apiPost(body){
  var bytes=[]; var s=JSON.stringify(body);
  var encoded=encodeURIComponent(s).replace(/%([0-9A-F]{2})/g,function(_,p){return String.fromCharCode('0x'+p);});
  return fetch(API_BASE,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:s}).then(function(r){return r.json();});
}

function ensureAuth(){
  var t=localStorage.getItem(TOKEN_KEY); if(t) return true;
  t=prompt('管理者パスワードを入力してください'); if(t){localStorage.setItem(TOKEN_KEY,t);return true;}
  return false;
}
function getToken(){return localStorage.getItem(TOKEN_KEY)||'';}
function clearToken(){localStorage.removeItem(TOKEN_KEY);}

function fmtDate(iso){
  if(!iso) return '';
  var d=new Date(iso); if(isNaN(d)) return String(iso).slice(0,16);
  return d.getFullYear()+'/'+(('0'+(d.getMonth()+1)).slice(-2))+'/'+(('0'+d.getDate()).slice(-2))+' '+(('0'+d.getHours()).slice(-2))+':'+(('0'+d.getMinutes()).slice(-2));
}

function apiPostUtf8(body){
  var s=JSON.stringify(body);
  return fetch(API_BASE,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:s}).then(function(r){return r.json();});
}
</script>

<script>
/* ── 描画 ── */
function buildOpenUrl(b,t){return b.url+(t.docKey?'?doc='+encodeURIComponent(t.docKey):'');}
function buildAdminUrl(b,t){return b.url+(t.docKey?'?doc='+encodeURIComponent(t.docKey)+'&admin':'?admin');}
function fmtPage(p){
  if(p==null||String(p).trim()==='') return '?回';
  // 過去データ（数値型で保存）は「第N回」表記を維持。新規入力（文字列）はそのまま表示。
  return (typeof p==='number') ? '第'+p+'回' : String(p).trim();
}

function renderList(){
  var el=document.getElementById('list');
  var showDel=document.getElementById('chkDeleted').checked;
  var items=_books.filter(function(b){return showDel||!b.deleted;});
  if(!items.length){
    el.innerHTML='<div class="empty"><img src="serval.png" alt=""><p>ブックがまだありません。<br>「＋ 新規ブック」から大会シリーズを登録してください。</p><button class="primary" onclick="openBookEdit(null)">＋ 新規ブック</button></div>';
    return;
  }
  var html='';
  items.forEach(function(b,i){
    var hasUrl=!!(b.url&&String(b.url).trim());
    var tours=Array.isArray(b.tournaments)?b.tournaments:[];
    /* ── ブックヘッダー ── */
    html+='<div class="book-card'+(b.deleted?' deleted':'')+'" style="animation-delay:'+(i*40)+'ms" data-book-id="'+esc(b.id)+'">';
    html+='<div class="book-header">';
    html+='<span class="status-dot'+(hasUrl?'':' pending')+'" title="'+(hasUrl?'GAS登録済み':'準備中')+'"></span>';
    html+='<div class="book-meta"><div class="book-name">'+esc(b.name||'（無名）')+'</div>';
    html+='<div class="book-id">'+esc(b.id||'')+(b.note?' ・ '+esc(b.note):'')+'</div></div>';
    html+='<div class="book-actions">';
    if(b.deleted){
      html+='<span class="del-tag">削除済み</span><button class="ghost sm" onclick="restoreBook(\''+esc(b.id)+'\')">復元</button>';
    }else{
      html+='<button class="ghost sm" onclick="openBookEdit(\''+esc(b.id)+'\')">編集</button>';
      html+='<button class="ghost sm danger" onclick="deleteBook(\''+esc(b.id)+'\')">削除</button>';
    }
    html+='</div></div>'; /* /book-header */

    /* ── GAS未設定の場合はセットアップ案内 ── */
    if(!hasUrl&&!b.deleted){
      html+='<div class="setup"><b>GAS準備中</b> — セットアップ手順:'
        +'<ol>'
        +'<li>script.google.com で既存の serval プロジェクトを開き「コピーを作成」</li>'
        +'<li>「デプロイ → 新しいデプロイ → ウェブアプリ（全員がアクセス可）」でURLを取得</li>'
        +'<li>スクリプトプロパティに <code>ADMIN_TOKEN</code> を設定</li>'
        +'<li>このカードの「編集」からURLを登録</li>'
        +'</ol></div>';
    }

    /* ── トーナメント一覧 ── */
    if(tours.length){
      html+='<div class="tournament-list">';
      // ページ降順で表示（数値のページは新しい順、数値以外は追加順で数値の後ろに）
      var sorted=tours.map(function(t,i){return {t:t,i:i};}).sort(function(A,B){
        var an=Number(A.t.page), bn=Number(B.t.page);
        var aNum=A.t.page!=null&&String(A.t.page).trim()!==''&&!isNaN(an);
        var bNum=B.t.page!=null&&String(B.t.page).trim()!==''&&!isNaN(bn);
        if(aNum&&bNum) return bn-an;
        if(aNum) return -1;
        if(bNum) return 1;
        return B.i-A.i;
      }).map(function(x){return x.t;});
      sorted.forEach(function(t,ti){
        var openUrl=hasUrl?buildOpenUrl(b,t):'';
        var adminUrl=hasUrl?buildAdminUrl(b,t):'';
        var tIdx=tours.indexOf(t);
        var editAttr=b.deleted?'':' ondblclick="startInlineEdit(\''+esc(b.id)+'\','+tIdx+',\'FIELD\',this)" title="ダブルクリックで編集"';
        html+='<div class="tournament-row">';
        html+='<span class="t-page"'+editAttr.replace('FIELD','page')+'>'+esc(fmtPage(t.page))+'</span>';
        html+='<span class="t-key">'+esc(t.docKey||'')+'</span>';
        html+='<span class="t-champion'+(t.champion?'':' t-champion-empty')+'"'+editAttr.replace('FIELD','champion')+'>'+(t.champion?'🏆 '+esc(t.champion):'（優勝未定）')+'</span>';
        html+='<span class="t-runner'+(t.runnerUp?'':' t-runner-empty')+'"'+editAttr.replace('FIELD','runnerUp')+'>'+(t.runnerUp?'🥈 '+esc(t.runnerUp):'（準優勝未定）')+'</span>';
        html+='<span class="t-note'+(t.note?'':' t-note-empty')+'"'+editAttr.replace('FIELD','note')+'>'+(t.note?esc(t.note):'（メモを追加）')+'</span>';
        html+='<div class="t-btns">';
        if(hasUrl){
          html+='<a class="btnlike primary" href="'+esc(openUrl)+'" target="_blank" rel="noopener">開く</a>';
          html+='<a class="btnlike" href="'+esc(adminUrl)+'" target="_blank" rel="noopener">管理</a>';
        }
        if(!b.deleted){
          html+='<button class="ghost sm danger" onclick="removeTournament(\''+esc(b.id)+'\','+tIdx+')">×</button>';
        }
        html+='</div></div>';
      });
      html+='</div>';
    }else if(hasUrl){
      html+='<div class="no-tournaments">トーナメントがまだありません。下の行から追加してください。</div>';
    }

    /* ── トーナメント追加行 ── */
    if(!b.deleted&&hasUrl){
      html+='<div class="add-row" id="add-row-'+esc(b.id)+'">';
      html+='<div class="add-row-inner">';
      html+='<label>回次・シーズン</label>';
      html+='<input class="inp-page" type="text" maxlength="20" placeholder="第8回 / 2026 / 第3期 / TOKYO" id="add-page-'+esc(b.id)+'">';
      html+='<label>トーナメント名</label>';
      html+='<input class="inp-key" type="text" maxlength="100" placeholder="tournament1" id="add-key-'+esc(b.id)+'" oninput="validateDocKeyInput(\''+esc(b.id)+'\')">';
      html+='<input type="text" maxlength="200" placeholder="メモ（任意）" style="flex:1;min-width:80px" id="add-note-'+esc(b.id)+'">';
      html+='<div class="key-warn" id="add-key-warn-'+esc(b.id)+'"></div>';
      html+='</div>';
      html+='<button class="sm primary" onclick="addTournament(\''+esc(b.id)+'\')">＋ 追加</button>';
      html+='</div>';
    }

    html+='</div>'; /* /book-card */
  });
  el.innerHTML=html;
}
</script>

<script>
/* ── 操作 ── */
function loadList(){
  document.getElementById('list').innerHTML='<div class="loading">LOADING…</div>';
  apiGetList().then(function(r){
    if(r&&r.ok){_books=r.books||[];renderList();}
    else toast((r&&r.error)||'一覧の取得に失敗しました',true);
  }).catch(function(){
    document.getElementById('list').innerHTML='<div class="empty"><img src="serval.png" alt=""><p>一覧を取得できませんでした。</p><button onclick="loadList()">再試行</button></div>';
  });
}

/* ブック作成・編集 */
function openBookEdit(id){
  if(!ensureAuth()) return;
  var dlg=document.getElementById('bookDlg');
  if(id){
    var b=null; _books.forEach(function(x){if(x.id===id)b=x;});
    if(!b){toast('ブックが見つかりません',true);return;}
    _editingBook=b;
    document.getElementById('bookDlgTitle').textContent='ブックを編集';
    document.getElementById('fName').value=b.name||'';
    document.getElementById('fUrl').value=b.url||'';
    document.getElementById('fNote').value=b.note||'';
  }else{
    _editingBook=null;
    document.getElementById('bookDlgTitle').textContent='新規ブック';
    document.getElementById('fName').value='';
    document.getElementById('fUrl').value=GO_URL;
    document.getElementById('fNote').value='';
  }
  dlg.showModal();
  document.getElementById('fName').focus();
}

function saveBook(){
  var name=document.getElementById('fName').value.trim();
  if(!name){toast('ブック名を入力してください',true);return;}
  var url=document.getElementById('fUrl').value.trim();
  if(url&&url!==GO_URL&&!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)){
    if(!confirm('URLがGASの /exec 形式ではないようです。このまま保存しますか？'))return;
  }
  var note=document.getElementById('fNote').value.trim();
  var token=getToken(); if(!token){toast('パスワードが未設定です',true);return;}
  var btn=document.getElementById('btnBookSave'); btn.disabled=true;
  var done=function(r){
    btn.disabled=false;
    if(r&&r.ok){document.getElementById('bookDlg').close();toast('保存しました');loadList();}
    else{var msg=(r&&r.error)||'保存に失敗しました';if(msg.indexOf('認証')>=0)clearToken();toast(msg,true);}
  };
  var fail=function(e){btn.disabled=false;toast('保存エラー: '+(e&&e.message||e),true);};
  if(_editingBook){
    var obj=Object.assign({},_editingBook,{name:name,url:url,note:note});
    apiPostUtf8({action:'bookUpdate',id:_editingBook.id,book:obj,token:token}).then(done).catch(fail);
  }else{
    apiPostUtf8({action:'bookCreate',name:name,token:token}).then(function(r){
      if(!(r&&r.ok)){done(r);return;}
      if(!url&&!note){done(r);return;}
      var obj=Object.assign({},r.book,{url:url,note:note});
      apiPostUtf8({action:'bookUpdate',id:obj.id,book:obj,token:token}).then(done).catch(fail);
    }).catch(fail);
  }
}

/* トーナメント名（docKey）バリデーション: URLの ?doc= に使われるため半角英数字推奨 */
var DOCKEY_RE=/^[A-Za-z0-9_-]{1,30}$/;
function validateDocKeyInput(bookId){
  var el=document.getElementById('add-key-'+bookId);
  var warn=document.getElementById('add-key-warn-'+bookId);
  if(!el||!warn) return;
  var v=el.value.trim();
  var ok=(v===''||DOCKEY_RE.test(v));
  if(ok){warn.className='key-warn'; el.style.borderColor='';}
  else{warn.textContent='URL（?doc=）に使われるため、半角英数字・-_のみ・30字以内を推奨します';warn.className='key-warn show'; el.style.borderColor='var(--danger)';}
}

/* トーナメント追加 */
function addTournament(bookId){
  if(!ensureAuth()) return;
  var b=null; _books.forEach(function(x){if(x.id===bookId)b=x;});
  if(!b){toast('ブックが見つかりません',true);return;}
  var pageEl=document.getElementById('add-page-'+bookId);
  var keyEl=document.getElementById('add-key-'+bookId);
  var noteEl=document.getElementById('add-note-'+bookId);
  var page=(pageEl?pageEl.value.trim():'');
  var docKey=(keyEl?keyEl.value.trim():'');
  var tnote=(noteEl?noteEl.value.trim():'');
  if(!page){toast('回次・シーズンを入力してください',true);return;}
  if(!docKey){toast('トーナメント名を入力してください',true);return;}
  if(!DOCKEY_RE.test(docKey)){
    if(!confirm('トーナメント名が半角英数字の短い形式ではないようです（URLの ?doc= に使われます）。このまま追加しますか？'))return;
  }
  var tours=Array.isArray(b.tournaments)?b.tournaments.slice():[];
  tours.push({page:page,docKey:docKey,note:tnote});
  var obj=Object.assign({},b,{tournaments:tours});
  var token=getToken();
  apiPostUtf8({action:'bookUpdate',id:b.id,book:obj,token:token}).then(function(r){
    if(r&&r.ok){toast('追加しました');loadList();}
    else{if(r&&r.error&&r.error.indexOf('認証')>=0)clearToken();toast((r&&r.error)||'追加に失敗',true);}
  }).catch(function(e){toast('エラー: '+(e&&e.message||e),true);});
}

/* トーナメント編集（回次・メモをダブルクリックでインライン編集） */
function startInlineEdit(bookId,idx,field,el){
  if(!ensureAuth()) return;
  if(el.querySelector('input')) return;
  var b=null; _books.forEach(function(x){if(x.id===bookId)b=x;});
  if(!b) return;
  var tours=Array.isArray(b.tournaments)?b.tournaments:[];
  var t=tours[idx]; if(!t) return;
  var cur=field==='page'?fmtPage(t.page):(t[field]||'');
  var input=document.createElement('input');
  input.type='text';
  input.value=cur;
  input.maxLength=field==='page'?20:200;
  input.style.cssText='font:inherit;background:var(--night);border:1px solid var(--serval-dim);border-radius:5px;color:var(--text);padding:2px 6px;width:'+(field==='page'?'130px':'160px');
  el.textContent='';
  el.appendChild(input);
  input.focus(); input.select();
  var done=false;
  function commit(save){
    if(done) return; done=true;
    if(!save){renderList();return;}
    var v=input.value.trim();
    if(field==='page'){
      if(!v){toast('回次・シーズンを入力してください',true);renderList();return;}
    }
    if(v===(field==='page'?fmtPage(t.page):(t[field]||''))){renderList();return;}
    var newTours=tours.slice();
    var newT=Object.assign({},t); newT[field]=v;
    newTours[idx]=newT;
    var obj=Object.assign({},b,{tournaments:newTours});
    apiPostUtf8({action:'bookUpdate',id:b.id,book:obj,token:getToken()}).then(function(r){
      if(r&&r.ok){toast('更新しました');loadList();}
      else{if(r&&r.error&&r.error.indexOf('認証')>=0)clearToken();toast((r&&r.error)||'更新に失敗',true);renderList();}
    }).catch(function(e){toast('エラー: '+(e&&e.message||e),true);renderList();});
  }
  input.addEventListener('blur',function(){commit(true);});
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();input.blur();}
    else if(e.key==='Escape'){done=true;renderList();}
  });
}

/* トーナメント削除 */
function removeTournament(bookId,idx){
  if(!ensureAuth()) return;
  var b=null; _books.forEach(function(x){if(x.id===bookId)b=x;});
  if(!b) return;
  var tours=Array.isArray(b.tournaments)?b.tournaments.slice():[];
  var t=tours[idx];
  if(!confirm('「'+fmtPage(t&&t.page)+(t&&t.docKey?' ('+t.docKey+')':'')+' 」を削除しますか？\n（GASのデータは残ります）'))return;
  tours.splice(idx,1);
  var obj=Object.assign({},b,{tournaments:tours});
  apiPostUtf8({action:'bookUpdate',id:b.id,book:obj,token:getToken()}).then(function(r){
    if(r&&r.ok){toast('削除しました');loadList();}
    else{toast((r&&r.error)||'削除に失敗',true);}
  }).catch(function(e){toast('エラー: '+(e&&e.message||e),true);});
}

/* ブック削除・復元 */
function deleteBook(id){
  if(!ensureAuth()) return;
  var b=null; _books.forEach(function(x){if(x.id===id)b=x;});
  if(!confirm('「'+((b&&b.name)||id)+'」をポータルから削除しますか？\n（GASとデータは残ります。復元できます）'))return;
  apiPostUtf8({action:'bookDelete',id:id,token:getToken()}).then(function(r){
    if(r&&r.ok){toast('削除しました');loadList();}
    else{if(r&&r.error&&r.error.indexOf('認証')>=0)clearToken();toast((r&&r.error)||'削除に失敗',true);}
  }).catch(function(e){toast('エラー: '+(e&&e.message||e),true);});
}

function restoreBook(id){
  apiPostUtf8({action:'bookRestore',id:id,token:getToken()}).then(function(r){
    if(r&&r.ok){toast('復元しました');loadList();}
    else{toast((r&&r.error)||'復元に失敗',true);}
  }).catch(function(e){toast('エラー: '+(e&&e.message||e),true);});
}

/* ── 初期化 ── */
document.getElementById('btnNew').onclick=function(){openBookEdit(null);};
document.getElementById('btnReload').onclick=loadList;
document.getElementById('chkDeleted').onchange=renderList;
document.getElementById('btnBookSave').onclick=saveBook;
document.getElementById('btnBookCancel').onclick=function(){document.getElementById('bookDlg').close();};

loadList();

function openLb(src){
  document.getElementById('lb-img').src=src;
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeLb(){
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLb();});
</script>
</body>
</html>
