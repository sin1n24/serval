<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<link rel="icon" href="serval.ico?v=3">
<link rel="icon" href="https://sin1.studio/serval/serval.ico?v=3">
<title>トーナメント管理システム</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2a323d;
    --text:#e6edf3; --muted:#8b97a6; --accent:#4c8dff; --accent2:#2563eb;
    --red:#e23b3b; --blue:#2f6fe0; --white:#e8e8ea; --green:#2faa55;
    --win-bg:#11161d; --rep-bg:#161f2b; --dot:#1a212b;
    --hl:#1f2a3a; --btn-hover-bg:#222b36; --btn-hover-bd:#3a4554;
    --badge-win-bg:#0c5132; --badge-win-fg:#d8ffe9;
    --badge-seed-bg:#3a2f12; --badge-seed-fg:#f1c453;
    --seg-norm-bg:#39424f; --seed-seg-bg:#5a4710; --seed-seg-fg:#f1c453; --seed-seg-bd:#7a6014;
    --slotH:36px; --slotW:180px;
  }
  body[data-theme="light"]{
    --bg:#f4f6f9; --panel:#ffffff; --panel2:#eef1f5; --line:#d3d9e0;
    --text:#1a2230; --muted:#5b6675; --accent:#2563eb; --accent2:#2563eb;
    --win-bg:#f3f5f8; --rep-bg:#eef3fb; --dot:#dfe5ec;
    --hl:#e7eefb; --btn-hover-bg:#e6eaf0; --btn-hover-bd:#c3ccd6;
    --badge-win-bg:#d8f1e2; --badge-win-fg:#136b3e;
    --badge-seed-bg:#fbeaba; --badge-seed-fg:#7a5e10;
    --seg-norm-bg:#dfe4ea; --seed-seg-bg:#fff1c9; --seed-seg-fg:#7a5e10; --seed-seg-bd:#e3c879;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Segoe UI",-apple-system,"Helvetica Neue","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; overflow:hidden;
  }
  button{font-family:inherit; cursor:pointer}
  input,select,textarea{font-family:inherit}

  /* ---- レイアウト ---- */
  .app{display:flex; flex-direction:column; height:100vh}
  header.topbar{
    display:flex; align-items:center; gap:14px; padding:10px 16px;
    background:var(--panel); border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  .topbar h1{font-size:15px; margin:0; letter-spacing:.04em; font-weight:600; white-space:nowrap; user-select:none; -webkit-user-select:none; cursor:default}
  .topbar .spacer{flex:1}
  /* 大会名（ブロックタブの隣に優先表示） */
  .event-name-tab{
    font-size:16px; font-weight:700; color:var(--text); letter-spacing:.02em;
    background:transparent; border:1px solid transparent; border-radius:8px;
    padding:5px 10px; min-width:120px; margin-right:6px;
  }
  .event-name-tab:focus{ outline:none; border-color:var(--line); background:var(--panel2) }
  .event-name-tab::placeholder{ color:var(--muted); font-weight:500 }
  .event-name-tab[readonly]{ cursor:default }
  .phase-switch{display:flex; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:3px}
  .phase-switch button{
    border:0; background:transparent; color:var(--muted); padding:6px 16px; border-radius:7px; font-weight:600;
  }
  .phase-switch button.active{background:var(--accent2); color:#fff}

  .btn{
    border:1px solid var(--line); background:var(--panel2); color:var(--text);
    padding:7px 13px; border-radius:8px; font-weight:500;
  }
  .btn:hover{border-color:var(--btn-hover-bd); background:var(--btn-hover-bg)}
  .btn.primary{background:var(--accent2); border-color:var(--accent2); color:#fff}
  .btn.csvtop{width:100%; background:var(--green); border-color:var(--green); color:#fff; font-weight:700; margin-bottom:14px; padding:10px}
  .btn.csvtop:hover{filter:brightness(1.08)}
  .btn.primary:hover{background:#1d57d6}
  .btn.sm{padding:5px 9px; font-size:12.5px}
  .btn.danger{color:#e23b3b; border-color:#e23b3b}
  .btn.danger:hover{background:rgba(226,59,59,.1); border-color:#e23b3b}
  .btn.call{background:#e8821e; border-color:#e8821e; color:#fff; font-weight:700}
  .btn.call:hover{filter:brightness(1.08)}
  .btn.call:disabled{background:var(--line); border-color:var(--line); color:var(--muted); cursor:not-allowed; filter:none}
  .insp-rule{border:0; border-top:1px solid var(--line); margin:16px 0 0}
  .call-wrap{margin-top:16px}
  .call-desc{font-size:11px; color:var(--muted); text-align:center; margin-top:5px}

  /* 下部：次の試合キュー（閲覧・管理とも常時表示） */
  #queueBar{ flex:0 0 auto; display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; padding:8px 14px;
    background:var(--panel); border-top:1px solid var(--line); min-height:46px }
  .q-item{ display:flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:8px;
    padding:4px 10px; background:var(--panel2); white-space:nowrap }
  /* 状態色（ブラケットの試合番号と対応）: 次=橙 / 2・3番手=琥珀 / スキップ=灰 */
  .q-item.st-next{ border-color:#e8821e; box-shadow:inset 4px 0 0 #e8821e }
  .q-item.st-next .q-no{ color:#e8821e }
  .q-item.st-soon{ border-color:#e8a24e; box-shadow:inset 4px 0 0 #e8a24e }
  .q-item.st-soon .q-no{ color:#b9701a }
  .q-item.st-skip{ opacity:.7; border-style:dashed }
  .q-item.st-skip .q-no, .q-item.st-skip .q-lab{ color:var(--muted) }
  .q-lab{ font-size:11px; color:var(--muted); font-weight:700 }
  .q-no{ font-weight:800; color:var(--accent); min-width:18px; text-align:center }
  .q-vs{ font-size:13px }
  .q-sub{ font-size:11px; color:var(--muted) }
  .q-sep{ font-size:11px; color:var(--muted); font-weight:700; padding-left:6px; border-left:1px solid var(--line); align-self:stretch; display:flex; align-items:center }
  .q-empty{ color:var(--muted); font-size:13px }

  .body{display:flex; flex:1 1 auto; min-height:0}

  /* ---- 閲覧専用モード（観客向け）：操作UIを隠し、ブラケットのみ表示 ---- */
  body.view-mode .topbar,
  body.view-mode aside.controls,
  body.view-mode aside.inspector,
  body.view-mode #docKey,
  body.view-mode #btnLoad,
  body.view-mode #btnSave,
  body.view-mode #btnExport,
  body.view-mode #btnImport,
  body.view-mode #themeToggle,
  body.view-mode #envPill{ display:none !important; }
  #btnViewMode{ display:none }                       /* 管理者モード時のみ表示 */
  body:not(.view-mode) #btnViewMode{ display:inline-block }
  /* 閲覧時の秘密アンロック用ホットスポット（左上の透明領域をトリプルクリック） */
  #secretSpot{ position:fixed; top:0; left:0; width:54px; height:54px; z-index:9999 }
  body:not(.view-mode) #secretSpot{ display:none }

  /* ---- 左：設定パネル ---- */
  aside.controls{
    flex:0 0 280px; background:var(--panel); border-right:1px solid var(--line);
    padding:14px; overflow-y:auto;
  }
  .group{margin-bottom:18px}
  .group h2{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 9px}
  .field{margin-bottom:10px}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px}
  .field select,.field input[type=text],.field textarea{
    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:7px; padding:7px 9px; font-size:13px;
  }
  .field textarea{resize:vertical; min-height:90px; line-height:1.5}
  .row{display:flex; gap:8px}
  .row>*{flex:1}
  .check{display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; user-select:none}
  .check input{width:16px; height:16px; accent-color:var(--accent)}

  .ttabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
  .ttab{
    padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel2);
    color:var(--muted); font-weight:600; font-size:12.5px;
  }
  .ttab.active{border-color:var(--accent); color:var(--text); background:var(--hl)}

  /* ---- 中央：ブラケット ---- */
  main.stage{flex:1 1 auto; position:relative; overflow:auto; touch-action:pan-x pan-y; background:
    radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0) 0 0/22px 22px, var(--bg);}
  .stage-inner{position:relative; padding:46px 40px 30px}
  .champion-tag{position:absolute; font-size:11px; color:var(--muted); white-space:nowrap}
  .event-title{position:absolute; font-size:18px; font-weight:700; color:var(--text); white-space:nowrap; letter-spacing:.02em}
  .match-no{position:absolute; font-size:13px; font-weight:700; color:var(--accent);
    background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:0 6px; line-height:18px; z-index:2; white-space:nowrap}
  body.view-mode .match-no{font-size:11px; font-weight:400; line-height:16px}   /* 閲覧は小さく・太字解除 */
  /* 試合番号の状態色（下バーと対応）: 終了=緑 / 次=橙 / 2・3番手=琥珀 / スキップ=灰 */
  .match-no.st-done{color:#2faa55; border-color:#2faa55}
  .match-no.st-next{background:#e8821e; border-color:#e8821e; color:#fff}
  .match-no.st-soon{color:#b9701a; border-color:#e8a24e}
  .match-no.st-skip{color:var(--muted); border-style:dashed}
  .match-no.clickable{cursor:pointer}
  .match-no.clickable:hover{border-color:var(--accent); background:var(--hl)}
  .match-no.sel{background:var(--accent2); color:#fff; border-color:var(--accent2)}
  .mscore{position:absolute; width:22px; text-align:center; font-size:11px; font-weight:800; line-height:15px; z-index:2; pointer-events:none}
  .tname{position:absolute; font-size:13px; font-weight:700; color:var(--text); cursor:pointer;
    padding:2px 8px; border-radius:6px; background:var(--hl); border:1px solid var(--line)}
  .tname:hover{border-color:var(--accent)}
  .tab-rename{background:var(--panel2); border:1px solid var(--accent); color:var(--text);
    border-radius:7px; padding:5px 9px; font-size:13px; font-weight:600; width:150px}
  .ttab.toggle{margin-left:auto}
  .slot.winner.rep{background:var(--rep-bg); border-style:solid; border-color:var(--line)}
  .slot.winner.rep .name{font-style:normal; color:var(--text)}

  /* ---- 運用フェーズ ---- */
  .slot.run{background:var(--panel2); border-style:solid; color:var(--text); cursor:default}
  .slot.run.winner{color:var(--muted)}
  .slot.run .name{font-style:normal}
  .slot.run.won{border-color:var(--green); box-shadow:0 0 0 2px rgba(47,170,85,.35)}
  .badge.win{background:var(--badge-win-bg); color:var(--badge-win-fg); margin-left:5px}
  @keyframes advancePop{0%{transform:scale(.6);opacity:0} 60%{transform:scale(1.08)} 100%{transform:scale(1);opacity:1}}
  .slot.advance{animation:advancePop .45s ease-out; z-index:3}

  .winpicks{display:flex; flex-direction:column; gap:8px}
  .winpick{display:flex; align-items:center; gap:8px; text-align:left; padding:10px 12px;
    border:1px solid var(--line); background:var(--panel2); color:var(--text); border-radius:9px; font-size:14px; font-weight:600}
  .winpick .dot{width:12px; height:12px; border-radius:50%; flex:0 0 auto}
  .winpick.active{border-color:var(--green); box-shadow:0 0 0 2px rgba(47,170,85,.35)}
  .winpick:disabled{opacity:.4}
  .kind-group{margin-bottom:8px}
  .kg-label{display:block; font-size:11px; color:var(--muted); margin-bottom:4px}
  .kinds{display:grid; grid-template-columns:1fr 1fr; gap:7px}
  .kind{padding:9px 6px; border:1px solid var(--line); background:var(--panel2); color:var(--text); border-radius:8px; font-size:13px; font-weight:600}
  .kind.active{background:var(--accent2); border-color:var(--accent2); color:#fff}

  .spotlight{position:fixed; inset:0; background:rgba(4,7,12,.86); display:none;
    align-items:center; justify-content:center; z-index:100; backdrop-filter:blur(3px)}
  .spotlight.show{display:flex}
  .sp-body{display:flex; flex-direction:column; align-items:center; gap:24px}
  .sp-cards{display:flex; align-items:center; gap:40px}
  .sp-head{font-size:30px; font-weight:900; color:#f1c453; letter-spacing:.08em}
  .sp-card{min-width:300px; max-width:38vw; padding:34px 30px; border:3px solid var(--line);
    border-radius:18px; background:#0e141c; text-align:center; animation:spIn .5s cubic-bezier(.2,.9,.2,1.1)}
  .sp-cards .sp-card:nth-child(3){animation-delay:.08s; animation-fill-mode:backwards}
  @keyframes spIn{0%{transform:scale(.5) translateY(30px);opacity:0} 100%{transform:scale(1);opacity:1}}
  .sp-bar{height:8px; border-radius:6px; margin-bottom:18px}
  .sp-name{font-size:38px; font-weight:800; color:#fff; line-height:1.2; word-break:break-word}
  .sp-aff{font-size:18px; color:#9fb0c4; margin-top:10px}
  .sp-vs{font-size:34px; font-weight:900; color:#f1c453; letter-spacing:.05em}
  .sp-close{position:absolute; top:20px; right:24px; background:transparent; border:0; color:#fff; font-size:26px}

  /* 勝ち上がり演出 */
  #advance .adv-body{display:flex; flex-direction:column; align-items:center; gap:34px}
  .adv-cards{display:flex; align-items:center; gap:60px}
  .adv-card{min-width:240px; padding:30px 26px; border:3px solid var(--line); border-radius:18px;
    background:#0e141c; text-align:center; transition:transform .6s cubic-bezier(.2,.9,.2,1.1), opacity .6s, box-shadow .6s, border-color .6s}
  .adv-bar{height:8px; border-radius:6px; margin-bottom:16px}
  .adv-nm{font-size:34px; font-weight:800; color:#fff; word-break:break-word}
  .adv-card.win{transform:scale(1.35); border-color:#e23b3b; box-shadow:0 0 34px rgba(226,59,59,.65)}
  .adv-card.lose{transform:scale(.66); opacity:.42}
  .adv-spark{font-size:50px; animation:advSpark .34s 3 ease-in-out}
  @keyframes advSpark{0%,100%{opacity:.15; transform:scale(.7)} 50%{opacity:1; transform:scale(1.5); filter:drop-shadow(0 0 12px #ffd24a)}}
  .adv-line{width:0; height:6px; background:#e23b3b; border-radius:4px; box-shadow:0 0 12px rgba(226,59,59,.7)}
  #advance.phase-result .adv-line{width:62vw; transition:width .85s ease}
  /* 縦長／横幅が狭い画面では演出カードを上下に並べて見切れ防止 */
  @media (max-aspect-ratio: 1/1), (max-width: 760px){
    .sp-cards, .adv-cards{flex-direction:column; gap:14px}
    .sp-card, .adv-card{min-width:0; max-width:84vw; padding:18px 20px}
    .sp-name, .adv-nm{font-size:26px}
    .sp-aff{font-size:14px; margin-top:6px}
    .sp-vs{font-size:24px}
    .sp-head{font-size:22px}
    .adv-spark{font-size:36px}
    .adv-card.win{transform:scale(1.12)}
    .adv-card.lose{transform:scale(.82)}
  }

  .slot{
    position:absolute; height:var(--slotH); width:var(--slotW);
    background:var(--panel2); border:1px solid var(--line); border-radius:7px;
    display:flex; align-items:center; overflow:hidden; cursor:pointer;
    transition:border-color .12s, box-shadow .12s;
  }
  .slot:hover{border-color:var(--accent)}
  .slot.selected{border-color:var(--accent); box-shadow:0 0 0 2px rgba(76,141,255,.35)}
  .slot[draggable=true]{cursor:grab}
  .slot.dragging{opacity:.45}
  .slot.drop-target{border-color:var(--green); box-shadow:0 0 0 2px rgba(47,170,85,.5)}
  .slot .stripe{width:6px; align-self:stretch; flex:0 0 auto; background:var(--line)}
  .slot .name{
    flex:1; padding:0 8px; font-size:inherit; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .slot .name.empty{color:var(--muted); font-style:italic}
  .slot .name .sub{color:var(--muted); font-size:10.5px; margin-left:5px}
  .slot .num{flex:0 0 auto; font-size:10.5px; color:var(--muted); padding:0 5px; border-right:1px solid var(--line)}
  .slot .badge{
    flex:0 0 auto; font-size:10px; font-weight:700; padding:1px 5px; margin-right:5px; border-radius:4px;
  }
  .slot .badge.seed{background:var(--badge-seed-bg); color:var(--badge-seed-fg)}
  .slot.bye{opacity:.35; border-style:dashed; cursor:default}
  .slot.winner{background:var(--win-bg); border-style:dashed; color:var(--muted); cursor:default}
  .slot.winner .name{font-style:italic; color:var(--muted)}

  svg.lines{position:absolute; top:0; left:0; overflow:visible; pointer-events:none}
  svg.lines path{fill:none; stroke:var(--bracket-line,#33404f); stroke-width:1.5}
  svg.lines path.win{stroke:var(--win-line,#e23b3b); stroke-width:3.5}
  .qz{z-index:6 !important}   /* 順位・3位決定戦はttabs(大会名)より前面＝近くへ配置しても隠れない */
  svg.lines path.win.blink{animation:lineBlink .5s ease-in-out 4}
  @keyframes lineBlink{0%,100%{opacity:1; stroke-width:3.5} 50%{opacity:.12; stroke-width:7}}

  /* ---- 右：選手エディタ ---- */
  aside.inspector{
    flex:0 0 300px; background:var(--panel); border-left:1px solid var(--line);
    padding:14px; overflow-y:auto;
  }
  .inspector .placeholder{color:var(--muted); font-size:13px; line-height:1.7; padding-top:30px; text-align:center}
  .seg{display:flex; gap:6px}
  .seg button{
    flex:1; border:1px solid var(--line); background:var(--panel2); color:var(--muted);
    padding:7px 0; border-radius:7px; font-size:12.5px; font-weight:600;
  }
  .seg button.active{color:#fff}
  .seg button.s-normal.active{background:var(--seg-norm-bg); border-color:var(--btn-hover-bd); color:var(--text)}
  .seg button.s-seed.active{background:var(--seed-seg-bg); border-color:var(--seed-seg-bd); color:var(--seed-seg-fg)}
  .colorseg{display:flex; gap:6px}
  .colorseg button{flex:1; height:30px; border-radius:7px; border:2px solid rgba(0,0,0,.45); padding:0}
  .colorseg button.active{border-color:#000; box-shadow:0 0 0 2px #fff}   /* 黒枠＋白ハローで白でも見える */
  .palette{display:flex; gap:6px}
  .palette .pal{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px}
  .palette input[type=color]{width:100%; height:26px; padding:0; border:1px solid var(--line);
    border-radius:6px; background:var(--panel2); cursor:pointer}
  .palette input[type=text]{width:100%; text-align:center; background:var(--panel2);
    border:1px solid var(--line); color:var(--text); border-radius:5px; font-size:11px; padding:2px}
  .settings-panel{border-top:1px dashed var(--line); margin-top:10px}
  .settings-panel[hidden]{display:none}

  .hint{font-size:11.5px; color:var(--muted); line-height:1.6; margin-top:6px}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:#0c5132; color:#d8ffe9; border:1px solid #1a7a4e; padding:9px 18px; border-radius:9px;
    font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:50;
  }
  .toast.show{opacity:1}
  .toast.err{background:#5b1212; border-color:#8a1f1f; color:#ffd8d8}
  .env-pill{font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:20px; padding:3px 9px}
  .theme-toggle{background:transparent; border:0; font-size:17px; opacity:.65; padding:2px 6px; line-height:1}
  .theme-toggle:hover{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>🏆 トーナメント管理システム "serval" ver13</h1>
    <div class="spacer"></div>
    <span class="env-pill" id="envPill">環境判定中…</span>
    <button class="theme-toggle" id="themeToggle" title="テーマ切替">🌙</button>
    <input id="docKey" class="btn" style="width:160px" value="default" title="保存キー（ドキュメント名）">
    <button class="btn" id="btnLoad">読込</button>
    <button class="btn primary" id="btnSave">保存</button>
    <button class="btn" id="btnExport">JSON↓</button>
    <button class="btn" id="btnImport">JSON↑</button>
    <button class="btn" id="btnViewMode" title="閲覧専用モードを確認">👁 閲覧</button>
  </header>

  <div class="body">
    <!-- 左：全体設定 -->
    <aside class="controls">
      <button class="btn csvtop" id="btnCsv">⬆ CSV読込</button>

      <div class="group">
        <h2>名前リスト</h2>
        <div class="field">
          <label>1行1名</label>
          <textarea id="nameList" placeholder="ロボA（チームA）&#10;ロボB&#10;…"></textarea>
        </div>

<script>
/* ============================================================
 *  Backend 抽象レイヤ : google.script.run があればGAS、無ければlocalStorage
 * ============================================================ */
const Backend = (function(){
  const hasGas = (typeof google !== 'undefined') && google.script && google.script.run;
  function gasCall(fn, args){
    return new Promise((resolve, reject)=>{
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null, args);
    });
  }
  function localKey(k){ return 'tm_store_' + k; }
  const local = {
    apiSave(key, json){ localStorage.setItem(localKey(key), json);
      return Promise.resolve({ok:true, key, updatedAt:new Date().toISOString()}); },
    apiLoad(key){ const j = localStorage.getItem(localKey(key));
      return Promise.resolve({ok:!!j, key, json:j}); },
    apiList(){ const keys=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
      if(k.startsWith('tm_store_')) keys.push({key:k.slice(9)}); } return Promise.resolve({ok:true, keys}); },
    apiSubmitResult(key, json){ localStorage.setItem(localKey(key), json);
      return Promise.resolve({ok:true, key, receivedAt:new Date().toISOString()}); }
  };
  return {
    hasGas,
    save:(k,j)=> hasGas ? gasCall('apiSave',[k,j]) : local.apiSave(k,j),
    load:(k)=> hasGas ? gasCall('apiLoad',[k]) : local.apiLoad(k),
    list:()=> hasGas ? gasCall('apiList',[]) : local.apiList(),
    submitResult:(k,j)=> hasGas ? gasCall('apiSubmitResult',[k,j]) : local.apiSubmitResult(k,j),
  };
})();

/* ============================================================
 *  状態
 * ============================================================ */
// 編集可能な色パレット（6色）。colorTop/colorBottom はこの配列のインデックスを指す。
const DEFAULT_PALETTE = [
  {name:'赤', hex:'#e23b3b'},
  {name:'青', hex:'#2f6fe0'},
  {name:'緑', hex:'#2faa55'},
  {name:'黄', hex:'#f1c40f'},
  {name:'白', hex:'#e8e8ea'},
  {name:'黒', hex:'#222831'},   // 6色目（編集可）
];
const clonePalette = ()=> DEFAULT_PALETTE.map(p=>({...p}));
const paletteHex = (idx)=>{ const p=state.config.palette[idx]; return p?p.hex:'#888'; };

// 保存データの書式バージョン。読み込み時に照合・移行する。
const SCHEMA_VERSION = 1;

/* デフォルトのブロック名：1→Aブロック, 2→Bブロック … */
function blockName(id){ return String.fromCharCode(64 + id) + 'ブロック'; }
/* 代表表示用の短縮名：「Aブロック」→「A代表」（長すぎる被りを防ぐ） */
function shortRep(name){ return String(name||'').replace(/ブロック$/,'') + '代表'; }
function makeTournament(id, size){
  const slots = [];
  for(let i=0;i<size;i++){
    slots.push({
      player:null,        // {playerName, affiliation, representative, number, contact}
      seed:'normal'       // 'normal' | 'seed'
    });
  }
  // 色は対戦ペアの上=colorTop / 下=colorBottom（パレットのインデックス）
  // results: 試合結果。キー "r-j"（rラウンド/j試合）→ {win:0|1|null, kind, time}
  return { id, name:blockName(id), size, slots, colorTop:0, colorBottom:1, results:{} };
}

let state = {
  phase:'create',
  config:{ size:8, count:1, third:false, order:'block', players:0, seedCount:0, palette:clonePalette(),
           zoom:1, showAff:false, showNumber:false, showSeed:false, lineColor:'#33404f', autoSave:false,
           theme:'light', playerSize:'中', otherSize:'なし', recordTime:false, repMode:'tournament', hideByes:true,
           avoidSameAff:true, showMatchNo:false, centerStyle:false, winLineColor:'#e23b3b', eventName:'' },
  version: SCHEMA_VERSION,
  roster: [],          // CSV等で読み込んだ選手のマスター（情報保持用）
  rosterLabel: '',     // 名前リスト欄に表示するCSVファイル名
  repT:null,           // 代表トーナメント（複数時、同期される仮想トーナメント）
  repLeague:{},        // 代表リーグ戦の結果（'a-b'→{win,kind,time}）
  skipped:{},          // スキップした試合（matchNoMapキー→true）
  priority:[],         // 「次の試合にする」で前に出した試合（matchNoMapキー、先頭ほど優先）
  tournaments:[ makeTournament(1, 8) ],
  active:0,
  stacked:false,       // 並べて表示（縦並べ）
  sel:null,            // 作成フェーズの選択 {t, slot}
  runSel:null,         // 運用フェーズの選択 {tid, r, idx}
  pending:null,        // 結果入力中 {win, kind, time}
};

/* ============================================================
 *  閲覧専用モード（観客向け）と管理者アンロック
 *   - 通常アクセスは既定で閲覧専用：操作UIを隠し、ブラケットのみ自動更新で表示
 *   - 管理者はタイトルを素早く7回タップ→パスワードで作成/運用へ
 * ============================================================ */
let viewMode = true;                  // ★既定は閲覧専用（通常アクセス）
const ADMIN_PASS = 'serval';          // ★管理者パスワード（運用前に変更してください）
const REFRESH_MS = 7000;              // 閲覧時の自動更新間隔（ミリ秒）
/* フェーズ統合：常に結果（勝ち上がり・勝者線）を反映して描画する */
function runView(){ return true; }

let _booted=false;                    // 初回のバックエンド取得が終わったか
function showLoading(){
  const inner=document.getElementById('stageInner');
  if(!document.getElementById('loadingMsg')){
    const l=document.createElement('div'); l.id='loadingMsg'; l.textContent='読み込み中…';
    l.style.cssText='position:absolute; left:40px; top:60px; color:var(--muted); font-size:14px';
    inner.appendChild(l);
  }
}
function applyViewMode(){
  document.body.classList.toggle('view-mode', viewMode);
  startAutoRefresh();                 // 管理者・閲覧ともに定期同期（複数人運用を想定）
  if(!_booted) showLoading();         // 初回はバックエンド取得まで素のトーナメントを描かない
  else renderAll();
}
/* 起動直後の初回読込（両モード）。保存docがあれば反映し、なければ現状を描画。 */
async function initialLoad(){
  const key=document.getElementById('docKey').value||'default';
  try{
    const r=await Backend.load(key);
    if(r && r.ok && r.json){
      const obj=JSON.parse(r.json); const res=loadParsed(obj);
      if(res.ok){ _lastRemoteJson=r.json; markSaved(); syncConfigInputs(); }
    }
  }catch(e){ /* 取得失敗は現状描画 */ }
  _booted=true;
  renderAll();
  if(viewMode) maybeShowBroadcast();
}
function enterAdmin(){ viewMode=false; syncConfigInputs(); applyViewMode(); toast('管理者モード'); }
function enterViewMode(){ viewMode=true; state.sel=null; state.runSel=null; state.pending=null; applyViewMode(); }

/* 自動更新：閲覧は常に反映、管理者は編集中でないときだけ反映（複数人で管理画面を共有可） */
let refreshTimer=null, _lastRemoteJson=null;
function startAutoRefresh(){ if(!refreshTimer) refreshTimer=setInterval(refreshTick, REFRESH_MS); }
function stopAutoRefresh(){ if(refreshTimer){ clearInterval(refreshTimer); refreshTimer=null; } }
function refreshTick(){
  if(viewMode){ refreshFromBackend(); return; }
  if(!_booted) return;                         // 初回読込前は何もしない
  if(isDirty()) autoSyncSave();                // 管理者の変更を保存→閲覧側に反映
  else adminRefresh();                         // 変更なしなら他管理者の更新を取得
}
/* 管理者の変更を保存（閲覧モードへ反映させるため）。 */
function autoSyncSave(){
  const key=document.getElementById('docKey').value||'default';
  Backend.save(key, JSON.stringify(state)).then(r=>{ if(r&&r.ok){ markSaved(); _lastRemoteJson=JSON.stringify(state); } }).catch(()=>{});
}
/* 管理者：未保存の変更・編集中（枠/試合の選択あり）のときは触らない。それ以外は最新を取り込む。 */
async function adminRefresh(){
  if(viewMode) return;
  if(state.sel || state.runSel) return;        // 編集・結果入力中は中断しない
  if(isDirty()) return;                        // 未保存の変更があるなら上書きしない
  const key=document.getElementById('docKey').value||'default';
  try{
    const r=await Backend.load(key);
    if(r && r.ok && r.json && r.json!==_lastRemoteJson){
      _lastRemoteJson=r.json;
      if(r.json===JSON.stringify(state)) return;   // 自分の状態と同一なら再描画不要
      const obj=JSON.parse(r.json);
      const keepActive=state.active, keepStacked=state.stacked;
      const res=loadParsed(obj); if(!res.ok) return;
      if(keepActive < state.tournaments.length) state.active=keepActive;
      state.stacked=keepStacked;
      markSaved(); syncConfigInputs(); renderAll();
      maybeShowBroadcast();               // 他の管理者が押した演出も表示
    }
  }catch(e){ /* 取得失敗は無視 */ }
}
async function refreshFromBackend(){
  if(!viewMode) return;
  const key=document.getElementById('docKey').value||'default';
  try{
    const r=await Backend.load(key);
    if(r && r.ok && r.json){
      const obj=JSON.parse(r.json);
      const keepActive=state.active, keepStacked=state.stacked, keepZoom=state.config.zoom;   // タブ/並べ/ズームは閲覧者ごとに保持
      const res=loadParsed(obj); if(!res.ok) return;
      if(keepActive < state.tournaments.length) state.active=keepActive;
      state.stacked=keepStacked;
      if(keepZoom) state.config.zoom=keepZoom;                    // ピンチズームを上書きしない
      markSaved();                                                // 閲覧側は常に「保存済み」基準（離脱警告を出さない）
      renderAll();
      maybeShowBroadcast();                             // 管理者が押した演出を閲覧側でも表示
    }
  }catch(e){ /* 取得失敗は無視（次回再試行） */ }
}

/* 閲覧側：配信された演出（勝ち上がり→対戦カードの順）を再生（初回ロードでは出さない） */
let lastSpotlightTs=null, lastAdvanceTs=null;
function maybeShowBroadcast(){
  let delay=0, advEnd=0, advKey=null;
  const adv=state.advance;
  if(adv && adv.ts && adv.ts!==lastAdvanceTs){
    if(lastAdvanceTs!==null){ showAdvance({name:adv.aName},{name:adv.bName}, adv.win, adv.colA, adv.colB); delay=ADV_MS+CARD_GAP; advEnd=ADV_MS; advKey=adv.key||null; }
    lastAdvanceTs=adv.ts;
  }
  const sp=state.spotlight;
  let lastEnd=advEnd;
  if(sp && sp.ts && sp.ts!==lastSpotlightTs){
    if(lastSpotlightTs!==null){
      setTimeout(()=> showSpotlight({name:sp.aName, aff:sp.aAff}, {name:sp.bName, aff:sp.bAff}, sp.colTop, sp.colBot, sp.header||''), delay);
      lastEnd=delay+SP_MS;
    }
    lastSpotlightTs=sp.ts;
  }
  if(advKey) setTimeout(()=> blinkBracketWins(advKey), lastEnd+200);   // 演出後、勝ち上がった赤線だけ点滅
}

/* 管理者アンロック：タイトルをトリプルクリック（600ms以内に3回）→ パスワード照合 */
let tapCount=0, tapTimer=null;
function secretTap(){
  tapCount++; clearTimeout(tapTimer);
  tapTimer=setTimeout(()=>{ tapCount=0; }, 600);
  if(tapCount>=3){
    tapCount=0;
    const pass=prompt('管理者パスワード');
    if(pass===ADMIN_PASS) enterAdmin();
    else if(pass!=null) toast('パスワードが違います', true);
  }
}

/* ============================================================
 *  ブラケット生成
 * ============================================================ */
function rebuild(){
  const {size, count} = state.config;
  let structChanged = (count !== state.tournaments.length);   // 構造（ブロック数/サイズ）が変わったか
  const next = [];
  for(let i=0;i<count;i++){
    const old = state.tournaments[i];
    if(old && old.size === size){ next.push(old); }     // 既存をそのまま温存
    else if(old){                                       // サイズ変更：選手・名前・色を引き継ぐ
      structChanged = true;
      const t = makeTournament(i+1, size);
      t.name = old.name; t.colorTop = old.colorTop; t.colorBottom = old.colorBottom;
      const n = Math.min(old.slots.length, size);
      for(let s=0;s<n;s++){ t.slots[s].player = old.slots[s].player; t.slots[s].seed = old.slots[s].seed; }
      next.push(t);                                     // 結果(results)は構造が変わるためリセット
    }
    else { structChanged = true; next.push(makeTournament(i+1, size)); }
  }
  state.tournaments = next;
  if(structChanged){ state.repLeague={}; state.skipped={}; state.priority=[]; if(state.repT) state.repT.results={}; }  // 代表結果・スキップ・優先もリセット
  if(state.active >= count) state.active = 0;
  if(count <= 1) state.stacked = false;       // 1個なら並べ表示は無効
  state.sel = null;
  applySeeds(state.config.seedCount);         // シード枠数を配分
  renderAll();
}

/* ============================================================
 *  描画
 * ============================================================ */
// 枠サイズ（大中小）。選手枠(player)・その他枠(other)を別々に指定できる。
// 幅のみ変化（高さ・文字は固定）。小は大胆に小さく、大は大胆に大きく。
const SLOT_SIZES = { '小':{w:80,h:27,fs:12.5}, '中':{w:180,h:27,fs:12.5}, '大':{w:340,h:27,fs:12.5} };
const COL_GAP = 44, V_GAP = 6;
let DIM = null;
function computeDim(){
  const ps = SLOT_SIZES[state.config.playerSize||'中'] || SLOT_SIZES['中'];
  const none = (state.config.otherSize==='なし');
  const os = SLOT_SIZES[ none ? '小' : (state.config.otherSize||'中') ] || SLOT_SIZES['中'];
  // ow=描画する箱の幅。stepO=列送り幅（なしなら0で詰める）。作成・運用で同一。
  const ow = none ? SLOT_SIZES['小'].w : os.w;
  const stepO = none ? 0 : ow;
  DIM = { pw:ps.w, ph:ps.h, pfs:ps.fs, ow, oh:os.h, ofs:os.fs, stepO };
}
/* その他枠（空の勝者枠）を描かないか */
function hideOtherBoxes(){ return state.config.otherSize==='なし'; }
const colW = (r)=> r===0 ? DIM.pw : DIM.stepO;       // その列の送り幅（線の右端計算用）
const colH = (r)=> r===0 ? DIM.ph : DIM.oh;
const colX = (r)=> r===0 ? 0 : (DIM.pw+COL_GAP) + (r-1)*(DIM.stepO+COL_GAP);  // 列の左X
/* その他枠（勝者・代表など表示専用）のボックス生成 */
function winnerBox(label, extraCls){
  const box=document.createElement('div'); box.className='slot winner'+(extraCls||'');
  box.innerHTML='<span class="stripe"></span><span class="name">'+esc(label)+'</span>';
  box.style.width=DIM.ow+'px'; box.style.height=DIM.oh+'px'; box.style.fontSize=DIM.ofs+'px';
  return box;
}
/* 代表（出場者）枠：通常スロットと同じ濃い見た目＋色付きstripe。 */
function repColoredBox(label, colIdx, ww, hh, ff){
  const box=document.createElement('div'); box.className='slot'; box.style.cursor='default';
  box.innerHTML='<span class="stripe"></span><span class="name'+(label?'':' empty')+'">'+esc(label||'')+'</span>';
  box.style.width=(ww||DIM.ow)+'px'; box.style.height=(hh||DIM.oh)+'px'; box.style.fontSize=(ff||DIM.ofs)+'px';
  if(colIdx!=null) box.querySelector('.stripe').style.background=paletteHex(colIdx);
  return box;
}

function applyTheme(){
  const light = state.config.theme!=='dark';                 // 既定は通常(light)
  document.body.dataset.theme = light ? 'light' : 'dark';
  const tg=document.getElementById('themeToggle'); if(tg) tg.textContent = light ? '🌙' : '☀️';
  const sel=document.getElementById('setTheme'); if(sel) sel.value = light ? 'light' : 'dark';
}
function renderAll(){
  const lm=document.getElementById('loadingMsg'); if(lm) lm.remove();   // 読込中表示を消す
  applyTheme();
  renderTabs();
  renderColorPickers();
  renderBracket();
  renderInspector();
  renderQueueBar();
  scheduleAutoSave();
}
/* 下部バー：未実施の試合を番号順に「次の試合／2番手／3番手」、スキップは別枠で最大3件。 */
/* 並び順：優先(state.priority)を先頭、その後は試合番号順。 */
function queueRank(k){ const pi=(state.priority||[]).indexOf(k); return pi>=0 ? pi : (1e6 + (matchNoMap[k]||0)); }
/* 各試合のステータス: done(終了)/next(次)/soon(2・3番手)/skip(スキップ)/wait(待機) */
let _matchStatus={};
function computeMatchStatus(){
  _matchStatus={};
  const skip=state.skipped||{};
  const undone=Object.keys(matchNoMap).filter(k=> !matchDecided(k));
  undone.forEach(k=>{ _matchStatus[k] = skip[k] ? 'skip' : 'wait'; });
  const upc=undone.filter(k=> !skip[k]).sort((a,b)=> queueRank(a)-queueRank(b));
  if(upc[0]) _matchStatus[upc[0]]='next';
  if(upc[1]) _matchStatus[upc[1]]='soon';
  if(upc[2]) _matchStatus[upc[2]]='soon';
}
function matchStatus(key){ return matchDecided(key) ? 'done' : (_matchStatus[key]||'wait'); }
function renderQueueBar(){
  const bar=document.getElementById('queueBar'); if(!bar) return;
  const skip=state.skipped||{};
  const keys=Object.keys(matchNoMap).filter(k=> !matchDecided(k));
  keys.sort((a,b)=> queueRank(a)-queueRank(b));
  const upcoming=keys.filter(k=> !skip[k]);
  const skipped=keys.filter(k=> skip[k]);
  const labels=['次の試合','2番手','3番手'];
  const up = upcoming.slice(0,3).map((k,i)=>({k, lab:labels[i], st:(i===0?'next':'soon')}));   // 次の試合/2番手/3番手のみ
  const sk = skipped.map(k=>({k, lab:'スキップ', st:'skip'}));
  // 未来(最大3)＋スキップで合計4件まで。次の試合・2番手は必須。
  const show = up.concat(sk).slice(0, 4);
  const card=(it)=>{ const b=matchBrief(it.k);
    return '<div class="q-item st-'+it.st+'"><span class="q-lab">'+esc(it.lab)+'</span>'
      +'<span class="q-no">'+(b.no||'')+'</span><span class="q-vs">'+esc(b.a)+' vs '+esc(b.b)+'</span>'
      +'<span class="q-sub">'+esc(b.label)+'</span></div>'; };
  bar.innerHTML = show.length ? show.map(card).join('') : '<div class="q-empty">未実施の試合はありません</div>';
}
/* 未実施・非スキップで最小番号の試合キー（＝次の試合）。 */
function nextMatchKey(){
  const skip=state.skipped||{};
  const keys=Object.keys(matchNoMap).filter(k=> !matchDecided(k) && !skip[k]);
  keys.sort((a,b)=> queueRank(a)-queueRank(b));
  return keys[0]||null;
}
/* 試合キーからスポットライト（演出）を表示・配信。header をカード上部に表示。 */
function spotlightForKey(key, header){
  const b=matchBrief(key);
  if(!b || b.a==='未定' || b.b==='未定') return;          // 対戦者未確定なら出さない
  let colTop=paletteHex(0), colBot=paletteHex(1);
  if(key.slice(0,3)!=='LG:' && key.slice(0,4)!=='REP:'){
    const i=key.indexOf(':'); const t=tournById(+key.slice(0,i));
    if(t){ colTop=paletteHex(t.colorTop); colBot=paletteHex(t.colorBottom); }
  }
  showSpotlightCtx({ a:{name:b.a,aff:''}, b:{name:b.b,aff:''}, colTop, colBot, header });
}

function renderColorPickers(){
  renderPaletteEditor();
  const t = state.tournaments[state.active];
  const build=(elId, current, apply)=>{
    const el=document.getElementById(elId); if(!el) return;
    el.innerHTML = state.config.palette.map((p,idx)=>
      `<button data-i="${idx}" title="${esc(p.name)}" style="background:${p.hex}" class="${current===idx?'active':''}"></button>`).join('');
    el.querySelectorAll('[data-i]').forEach(b=> b.onclick=()=>{ apply(+b.dataset.i); renderAll(); });
  };
  if(!t) return;
  build('colTop', t.colorTop, i=> t.colorTop=i);
  build('colBottom', t.colorBottom, i=> t.colorBottom=i);
}

/* 6色パレットの編集UI（色と名前を変更可能） */
function renderPaletteEditor(){
  const el = document.getElementById('palette'); if(!el) return;
  el.innerHTML = state.config.palette.map((p,idx)=>
    `<div class="pal">
       <input type="color" data-ci="${idx}" value="${p.hex}">
       <input type="text" data-ni="${idx}" value="${esc(p.name)}" maxlength="4">
     </div>`).join('');
  el.querySelectorAll('[data-ci]').forEach(inp=> inp.oninput=()=>{
    state.config.palette[+inp.dataset.ci].hex = inp.value; renderColorPickers(); renderBracket(); });
  el.querySelectorAll('[data-ni]').forEach(inp=> inp.onchange=()=>{
    state.config.palette[+inp.dataset.ni].name = inp.value; });
}

function renderTabs(){
  const el = document.getElementById('ttabs');
  el.innerHTML = '';
  const multi = state.tournaments.length>1;
  // 大会名：ブロックタブの隣に優先表示（閲覧でも表示／管理者は編集可）
  if(!(viewMode && !(state.config.eventName||'').trim())){   // 閲覧で空のときは出さない
    const ev = document.createElement('input');
    ev.id='eventNameTab'; ev.className='event-name-tab'; ev.placeholder='大会名';
    ev.value = state.config.eventName || ''; ev.readOnly = viewMode;
    ev.oninput = ()=>{ state.config.eventName = ev.value; };
    el.appendChild(ev);
  }
  state.tournaments.forEach((t,i)=>{
    if(!multi) return;                                     // 1つだけならブロック名タブは出さない
    const b = document.createElement('button');
    b.className = 'ttab' + (i===state.active?' active':'');
    const empty = emptySlotCount(t);                       // 出場可能な空き枠数
    b.textContent = (t.name||blockName(i+1)) + '（空き' + empty + '/' + t.size + '）';
    b.onclick = ()=>{
      if(viewMode){ state.active=i; renderAll(); return; }            // 閲覧は切替のみ
      if(i===state.active && !state.stacked){ startTabRename(b, t); }  // 選択中タブの再クリックで改名
      else { state.active=i; state.sel=null; renderAll(); }
    };
    el.appendChild(b);
  });
  // 並べて表示トグル
  if(multi){
    const tg = document.createElement('button');
    tg.className = 'ttab toggle' + (state.stacked?' active':'');
    tg.textContent = state.stacked ? '▤ 個別表示に戻す' : '▦ 並べて表示';
    tg.onclick = ()=>{ state.stacked=!state.stacked; state.sel=null; renderAll(); };
    el.appendChild(tg);
  }
}

/* タブをその場でテキスト入力に変えて改名 */
function startTabRename(btn, t){
  const inp = document.createElement('input');
  inp.type='text'; inp.value=t.name; inp.className='tab-rename';
  btn.replaceWith(inp); inp.focus(); inp.select();
  const commit=()=>{ const v=inp.value.trim(); if(v) t.name=v; renderAll(); };
  inp.onblur=commit;
  inp.onkeydown=(e)=>{ if(e.key==='Enter') inp.blur(); if(e.key==='Escape') renderAll(); };
}

const SVGNS='http://www.w3.org/2000/svg';
let _winPaths=[];   // 勝者線は最後にまとめて前面へ（親への共通スタブに黒線が残るのを防止）
let _blinkKey=null;   // 点滅対象の勝者線（matchNoMapキー）
function drawConnector(svg, x1,y1, x2,y2, hl, bendX, winKey){
  const midx=(bendX!=null)?bendX:(x1+x2)/2;     // bendXで縦線（交点）の位置を指定可
  const p=document.createElementNS(SVGNS,'path');
  p.setAttribute('d', `M${x1},${y1} H${midx} V${y2} H${x2}`);
  if(hl){
    p.setAttribute('class', 'win' + (winKey && winKey===_blinkKey ? ' blink' : ''));  // 該当試合だけ点滅
    if(winKey) p.dataset.wk=winKey;
    _winPaths.push({svg,p});                                          // 勝者線は後で前面に重ねる
  } else svg.appendChild(p);
}
/* 試合(r,j)の勝者の子インデックス（0/1）。無ければ -1。運用時のみ。 */
function winChildOf(t, r, j){
  if(!runView()) return -1;
  const res=t.results && t.results[r+'-'+j];
  return (res && res.win!=null && res.kind!=='勝者なし') ? res.win : -1;
}
/* 3位決定戦を描画。準決勝(rounds-1, j=0/1)の敗者を表示。3位枠は無し固定（空）。
 *  small=true で優勝の隣に小さく表示。 */
function drawThirdPlace(inner, svg, t, leftX, yTop, small){
  const rounds=Math.log2(t.size), sf=rounds-1;           // 準決勝ラウンド
  const w = small ? Math.max(72, Math.round(DIM.pw*0.6)) : DIM.pw;
  const h = small ? 28 : DIM.ph;
  const fs = small ? 10.5 : DIM.pfs;
  const pitch = h + (small ? 6 : V_GAP);
  const yA=yTop+h/2, yB=yA+pitch, yM=(yA+yB)/2, x2=leftX+w+COL_GAP;
  const nameOf=(o)=> (o!=null) ? (competitorOf(t,o).name||'') : '';
  const la=loserOf(t,sf,0), lb=loserOf(t,sf,1);
  const res=t.results && t.results['3rd'];
  const wc=(res && res.win!=null && res.kind!=='勝者なし') ? res.win : -1;   // 3位決定戦の勝者(0/1)
  // 枠は通常の出場者枠と同じ見た目（normal slot）。stripeは位置の色。
  const mk=(x,y,lab,colIdx)=>{ const b=document.createElement('div'); b.className='slot qz'; b.style.cursor='default';
    b.innerHTML='<span class="stripe"></span><span class="name'+(lab?'':' empty')+'">'+esc(lab||'')+'</span>';
    b.style.left=x+'px'; b.style.top=(y-h/2)+'px'; b.style.width=w+'px'; b.style.height=h+'px'; b.style.fontSize=fs+'px';
    if(colIdx!=null) b.querySelector('.stripe').style.background=paletteHex(colIdx);
    inner.appendChild(b); };
  const tg=document.createElement('div'); tg.className='champion-tag qz';
  tg.textContent = '🥉 3位決定戦' + (viewMode?'':'（ドラッグで移動）');   // 閲覧では注記を出さない
  tg.style.left=leftX+'px'; tg.style.top=(yA-h/2-18)+'px';
  if(!viewMode){ tg.style.cursor='move'; tg.onpointerdown=(e)=>startThirdDrag(e); }
  inner.appendChild(tg);
  const winName = wc===0 ? nameOf(la) : (wc===1 ? nameOf(lb) : '');         // 3位＝勝った方
  const winCol  = wc===0 ? t.colorTop : (wc===1 ? t.colorBottom : null);
  mk(leftX,yA,nameOf(la), t.colorTop);      // 上＝上の色
  mk(leftX,yB,nameOf(lb), t.colorBottom);   // 下＝下の色
  mk(x2,yM,winName, winCol);                // 3位（決着で勝者名を表示）
  drawConnector(svg, leftX+w, yA, x2, yM, wc===0, undefined, t.id+':3rd');
  drawConnector(svg, leftX+w, yB, x2, yM, wc===1, undefined, t.id+':3rd');
  draw3rdMatchNo(inner, x2-10, yM, matchNoMap[t.id+':3rd'], t);   // 番号・勝ち数は3位枠の直前（線上）へ
  return { right:x2+w, bottom:yB+h/2 };
}
/* 3位決定戦タグのドラッグで表示位置を移動。位置は全トーナメント共通（state.config.thirdOffset）。 */
let _thirdDrag=null;
function startThirdDrag(e){
  e.preventDefault();
  if(!state.config.thirdOffset) state.config.thirdOffset={dx:0,dy:0};
  const o=state.config.thirdOffset;
  _thirdDrag={sx:e.clientX, sy:e.clientY, ox:o.dx, oy:o.dy};
  window.addEventListener('pointermove', onThirdDrag);
  window.addEventListener('pointerup', endThirdDrag);
}
function onThirdDrag(e){
  if(!_thirdDrag) return;
  const z=state.config.zoom||1;
  state.config.thirdOffset.dx=_thirdDrag.ox+(e.clientX-_thirdDrag.sx)/z;
  state.config.thirdOffset.dy=_thirdDrag.oy+(e.clientY-_thirdDrag.sy)/z;
  renderBracket();
}
function endThirdDrag(){ _thirdDrag=null;
  window.removeEventListener('pointermove', onThirdDrag);
  window.removeEventListener('pointerup', endThirdDrag);
}
/* 3位決定戦の試合番号（クリックで結果入力）。 */
function draw3rdMatchNo(inner, x, y, n, t){
  if(!n) return;
  const res=t.results && t.results['3rd'];
  if(res && res.kind){
    const [tw,bw]=scoreSides(res);
    mscore(inner, x, y-38, tw, paletteHex(t.colorTop));
    mscore(inner, x, y+7,  bw, paletteHex(t.colorBottom));
  }
  const d=document.createElement('div'); d.className='match-no qz st-'+matchStatus(t.id+':3rd'); d.textContent=n;
  d.style.left=(x-16)+'px'; d.style.top=(y-21)+'px';
  if(!viewMode){
    d.classList.add('clickable');
    if(state.runSel && state.runSel.tid===t.id && state.runSel.third) d.classList.add('sel');
    d.onclick=()=> openThirdMatch(t);
  }
  inner.appendChild(d);
}
function openThirdMatch(t){
  state.runSel={tid:t.id, third:true}; state.sel=null;
  const res=t.results && t.results['3rd'];
  state.pending = res ? {win:res.win, kind:res.kind, time:res.time||''} : {win:null,kind:null,time:''};
  renderAll();
}

/* 試合番号 */
let matchNoMap={}, matchNoNext=1;
function computeMatchNumbers(){
  matchNoMap={}; let n=1;
  // 各トーナメントの試合キーを「進行順」に並べたリストを作る
  const lists = state.tournaments.map(t=>{
    const rounds=Math.log2(t.size);
    const pl=[]; pl[0]=t.slots.map((s,i)=> isHiddenBySeed(t,i)?0:1);
    for(let r=1;r<=rounds;r++){ pl[r]=[]; for(let j=0;j*2<pl[r-1].length;j++) pl[r][j]=pl[r-1][2*j]+pl[r-1][2*j+1]; }
    const keys=[];
    for(let r=1;r<=rounds;r++) for(let j=0;j<pl[r].length;j++){
      // 3位決定戦は決勝の直前
      if(r===rounds && j===0 && state.config.third && rounds>=2
         && pl[rounds-2][0]>0 && pl[rounds-2][1]>0 && pl[rounds-2][2]>0 && pl[rounds-2][3]>0){
        keys.push(t.id+':3rd');
      }
      if(pl[r-1][2*j]>0 && pl[r-1][2*j+1]>0) keys.push(t.id+':'+r+':'+j);   // 実際に対戦が起きる節のみ
    }
    return keys;
  });
  // 逆シード：各ブロックで第1回戦の「シード同士」が多数のとき、そのブロックの「シード同士でない試合」を最優先
  //  （判定はブロックごと。例：Cブロックだけシードが多ければ、Cの非シード戦が試合番号1番になる）
  const rsKeys=new Set();
  state.tournaments.forEach(t=>{
    const half=t.size/2; let seedSide=0; const cand=[];
    for(let j=0;j<half;j++){
      const h0=isHiddenBySeed(t,2*j), h1=isHiddenBySeed(t,2*j+1);
      if(h0 && h1) continue;
      if(h0 || h1){ seedSide++; continue; }     // 片方が不戦＝シードのバイ進出（シード側として数える）
      // 両方表示＝(シード,シード) か (非シード,非シード)
      const a=t.slots[2*j], b=t.slots[2*j+1];
      if(a.seed==='seed' && b.seed==='seed') seedSide++; else cand.push(t.id+':1:'+j);
    }
    // シード側（バイ＋シード同士）が非シード戦より多い＝シードが多数派 → 非シード戦が逆シード
    if(seedSide > cand.length) cand.forEach(k=> rsKeys.add(k));
  });
  const reverseSeed = rsKeys.size>0;
  const assigned=new Set();
  const put=(k)=>{ if(k && !assigned.has(k)){ matchNoMap[k]=n++; assigned.add(k); } };
  if(state.config.order==='sequential'){
    // 順番に：全ブロックの逆シードを先頭にまとめ、その後 T1→T2→T3… と1試合ずつ巡回
    if(reverseSeed) lists.forEach(l=> l.forEach(k=>{ if(rsKeys.has(k)) put(k); }));
    const maxLen=Math.max(0, ...lists.map(l=>l.length));
    for(let i=0;i<maxLen;i++) for(let ti=0;ti<lists.length;ti++){ if(i<lists[ti].length) put(lists[ti][i]); }
  } else {
    // ブロックごと：各ブロック内で「逆シード→残り」の順に通しで採番
    lists.forEach(l=>{
      l.forEach(k=>{ if(rsKeys.has(k)) put(k); });
      l.forEach(k=> put(k));
    });
  }
  // 代表（複数時）— トーナメント or リーグ
  const cnt=state.tournaments.length;
  if(cnt>1){
    if(state.config.repMode==='league' && cnt===3){
      for(let a=0;a<cnt;a++) for(let b=a+1;b<cnt;b++) matchNoMap['LG:'+a+':'+b]=n++;
    } else {
      const repSize = cnt<=2?2:4, rr=Math.log2(repSize);
      const pl=[]; pl[0]=Array.from({length:repSize},(_,i)=> i<cnt?1:0);   // 代表の有無
      for(let r=1;r<=rr;r++){ pl[r]=[]; for(let j=0;j*2<pl[r-1].length;j++) pl[r][j]=pl[r-1][2*j]+pl[r-1][2*j+1]; }
      for(let r=1;r<=rr;r++) for(let j=0;j<pl[r].length;j++){
        if(pl[r-1][2*j]>0 && pl[r-1][2*j+1]>0) matchNoMap['REP:'+r+':'+j]=n++;
      }
    }
  }
  matchNoNext=n;
}
function drawMatchNo(inner, x, y, n, t, r, j, horizOff){
  if(!n) return;
  // 勝ち数。通常は番号の上下、horizOff指定時（中央決勝の決勝）は左右に表示。
  if(t){
    const res=t.results && t.results[r+'-'+j];
    if(res && res.kind){
      const [tw,bw]=scoreSides(res);
      if(horizOff){
        // 中央決勝：上方向に線を伸ばすため、勝ち数は線の下側に左右で表示
        mscore(inner, x-horizOff, y+7, tw, paletteHex(t.colorTop));      // 左＝win0（上の色）
        mscore(inner, x+horizOff+6, y+7, bw, paletteHex(t.colorBottom)); // 右＝win1（下の色）僅かに右へ
      } else {
        mscore(inner, x, y-38, tw, paletteHex(t.colorTop));   // 上側：線より上
        mscore(inner, x, y+7,  bw, paletteHex(t.colorBottom)); // 下側：線より下（重なり回避）
      }
    }
  }
  const d=document.createElement('div'); d.className='match-no st-'+(t?matchStatus(t.id+':'+r+':'+j):'wait'); d.textContent=n;
  d.style.left=(x-16)+'px'; d.style.top=(horizOff ? (y+5) : (y-21))+'px';   // 決勝は線の下側に番号
  if(!viewMode && t){                              // 管理者：番号クリックで結果入力（作成・運用の区別なし）
    d.classList.add('clickable');
    if(state.runSel && state.runSel.tid===t.id && state.runSel.mr===r && state.runSel.mj===j) d.classList.add('sel');
    d.onclick=()=> openRunMatch(t, r, j);
  }
  inner.appendChild(d);
}
function mscore(inner, x, top, txt, col){
  const d=document.createElement('div'); d.className='mscore'; d.textContent=txt;
  d.style.left=(x-16)+'px'; d.style.top=top+'px'; d.style.color=col; inner.appendChild(d);
}
/* 勝ち方から [上側の表示, 下側の表示] を返す（✕＝不戦・敗退） */
function scoreSides(res){
  if(res.kind==='勝者なし') return ['✖','✖'];                 // 両者✖（太字バツ）
  const map={'1-0勝ち':['1','0'], '2-0勝ち':['2','0'], '2-1勝ち':['2','1'], '不戦勝':['','✖']};
  const pair=map[res.kind]||['',''];                          // 不戦勝は勝者空欄・敗者✕
  return res.win===0 ? [pair[0],pair[1]] : [pair[1],pair[0]];  // win0=上が勝ち
}

function renderBracket(){
  const inner = document.getElementById('stageInner');
  inner.style.zoom = state.config.zoom || 1;                          // 表示倍率
  inner.style.setProperty('--bracket-line', state.config.lineColor || '#33404f');  // 接続線の色
  inner.style.setProperty('--win-line', state.config.winLineColor || '#e23b3b');   // 勝者線の色
  [...inner.querySelectorAll('.slot,.champion-tag,.event-title,.tname,.match-no,.mscore')].forEach(n=>n.remove());
  const svg = document.getElementById('lines'); svg.innerHTML=''; _winPaths=[];

  computeDim();
  computeMatchNumbers();
  computeMatchStatus();                 // 試合番号の色分け（終了/次/2・3番手/スキップ）
  const multi = state.tournaments.length>1;
  const shown = state.stacked
    ? state.tournaments.map((t,i)=>({t,i}))
    : [{t:state.tournaments[state.active], i:state.active}];

  let yCursor=0, maxRight=0, maxBottom=0;
  const champs = new Array(state.tournaments.length).fill(null);  // index -> {x,y,name}

  shown.forEach(({t,i})=>{
    const r = state.config.centerStyle ? drawCenterTournament(t, 0, yCursor, svg, inner, multi)
                                       : drawTournament(t, i, 0, yCursor, svg, inner, multi);
    champs[i] = { x:r.champRight, y:r.champY, name:t.name };
    maxRight = Math.max(maxRight, r.right);
    maxBottom = Math.max(maxBottom, r.bottom);
    // 3位決定戦：あり/なし。既定はブラケットの下、ドラッグ位置(thirdOffset)を加味。
    // ★レイアウトには影響させない（代表側の線がずれない）。必ずDnD可能なよう左上をクランプ。
    if(state.config.third && Math.log2(t.size)>=2){
      const off=state.config.thirdOffset||(state.config.thirdOffset={dx:0,dy:0});  // 全トーナメント共通
      let bx=0+off.dx, by=(r.bottom+40)+off.dy;            // 既定：ブラケットの下
      if(bx<2){ off.dx+=2-bx; bx=2; }                      // 左端でクランプ＋offset書き戻し（DnDのデッドゾーン防止）
      if(by<20){ off.dy+=20-by; by=20; }                   // 上端：🥉タグ(by-18)が見える範囲まで
      drawThirdPlace(inner, svg, t, bx, by, false);
    }
    yCursor = r.bottom + 50;
  });

  // 代表トーナメント／代表リーグ戦（複数時、右側に）
  if(multi){
    const useLeague = (state.config.repMode==='league' && state.tournaments.length===3);
    if(!useLeague) syncRepTournament();
    const rr = useLeague ? drawRepLeague(champs, maxRight + 90, svg, inner)
                         : drawRepTournament(champs, maxRight + 90, svg, inner);
    maxRight = Math.max(maxRight, rr.right);
    maxBottom = Math.max(maxBottom, rr.bottom);
  } else {
    // 単独トーナメント：順位表（優勝・準優勝・3位）を右側に
    const t=state.tournaments[state.active], so=state.config.standOffset||{dx:0,dy:0};
    if(Math.log2(t.size)>=1){
      const rows=placementRows(t, !!state.config.third, '優勝');
      const sb=drawStandingsBox(inner, maxRight+70+so.dx, 30+so.dy, rows, '🏆 順位');
      maxRight=Math.max(maxRight, sb.right); maxBottom=Math.max(maxBottom, sb.bottom);
    }
  }

  _winPaths.forEach(o=> o.svg.appendChild(o.p)); _winPaths=[];   // 勝者線を最前面へ

  // 実際に描画した要素の実寸からはみ出さないよう拡張（見切れ防止）
  inner.querySelectorAll('.slot,.champion-tag,.event-title,.match-no,.tname,.mscore').forEach(el=>{
    const l=parseFloat(el.style.left)||0, tp=parseFloat(el.style.top)||0;
    maxRight=Math.max(maxRight, l+el.offsetWidth);
    maxBottom=Math.max(maxBottom, tp+el.offsetHeight);
  });

  svg.setAttribute('width', maxRight+40); svg.setAttribute('height', maxBottom+40);
  inner.style.minWidth = (maxRight+70)+'px';
  inner.style.minHeight = (maxBottom+50)+'px';
}

/* 1トーナメントを (xOff,yOff) から描画。戻り値で優勝枠の位置と右端/下端を返す。 */
function drawTournament(t, tIndex, xOff, yOff, svg, inner, multi){
  const size=t.size, rounds=Math.log2(size), pitch=DIM.ph+V_GAP;
  const xOf=(r)=> xOff + colX(r);

  const centers=[]; centers[0]=t.slots.map((_,i)=> yOff + i*pitch + DIM.ph/2);
  for(let r=1;r<=rounds;r++){ const prev=centers[r-1]; centers[r]=[];
    for(let j=0;j*2<prev.length;j++) centers[r][j]=(prev[j*2]+prev[j*2+1])/2; }

  // タイトル（クリックで改名）。個別表示ではタブが名前を兼ねるので並べて表示時のみ。
  if(state.stacked){
    const title=document.createElement('div');
    title.className='tname'; title.textContent=t.name;
    title.style.left=xOf(0)+'px'; title.style.top=(yOff-24)+'px';
    title.onclick=()=>startTitleRename(title,t);
    inner.appendChild(title);
  }

  const hideByes = state.config.hideByes;
  const hasBye = t.slots.some((s,i)=> isHiddenBySeed(t,i));
  if(hideByes && hasBye){ return drawCollapsed(t, xOff, yOff, svg, inner, multi); }   // 作成・運用とも繰り上げ
  // round0 競技者
  t.slots.forEach((slot,i)=>{
    if(hideByes && isHiddenBySeed(t,i)) return;
    const box=buildSlot(t,slot,i);
    box.style.left=xOf(0)+'px'; box.style.top=(centers[0][i]-DIM.ph/2)+'px';
    inner.appendChild(box);
  });
  // round>=1 勝者枠。運用では占有者名を表示。なしなら線のみ。
  const skipOther = hideOtherBoxes();
  for(let r=1;r<=rounds;r++){
    centers[r].forEach((cy,j)=>{
      if(!skipOther){
        const box=winnerBox(nodeContent(t,r,j));
        box.style.left=xOf(r)+'px'; box.style.top=(cy-DIM.oh/2)+'px';
        tagNode(box,t,r,j);
        inner.appendChild(box);
      }
      drawMatchNo(inner, xOf(r), cy, matchNoMap[t.id+':'+r+':'+j], t, r, j);
    });
  }
  // 優勝/代表タグ
  const tag=document.createElement('div'); tag.className='champion-tag';
  tag.textContent = multi ? ('🏅 '+shortRep(t.name)) : '🏆 優勝';
  tag.style.left=xOf(rounds)+'px'; tag.style.top=(centers[rounds][0]-DIM.oh/2-18)+'px';
  inner.appendChild(tag);

  // コネクタ
  for(let r=1;r<=rounds;r++){
    centers[r].forEach((cy,j)=>{
      const wc=winChildOf(t,r,j);
      [j*2,j*2+1].forEach((ci,k)=>{
        if(r===1 && hideByes && isHiddenBySeed(t,ci)) return;   // 省略した不戦枠への線は引かない
        drawConnector(svg, xOf(r-1)+colW(r-1), centers[r-1][ci], xOf(r), cy, k===wc, undefined, t.id+':'+r+':'+j);
      });
    });
  }

  return {
    champRight: xOf(rounds)+colW(rounds),
    champY: centers[rounds][0],
    right: xOf(rounds)+colW(rounds),
    bottom: yOff + size*pitch
  };
}

/* 不戦枠を省略し、シードを次の列へ繰り上げて詰めて描く（作成フェーズ用）。
 *  例: 1回戦が不戦のシードは、2回戦の列に表示する。 */
function drawCollapsed(t, xOff, yOff, svg, inner, multi){
  const size=t.size, rounds=Math.log2(size), pitch=DIM.ph+V_GAP;
  const xOf=(r)=> xOff + colX(r);
  // 列の右端（お尻）。線はここから出る。幅の違う箱はこの右端に揃える。
  const rEdge=(col)=> (col===0) ? xOf(0)+DIM.pw : xOf(col)+DIM.stepO;

  // 出場者数を部分木ごとに集計（不戦=0）
  const pl=[]; pl[0]=t.slots.map((s,i)=> isHiddenBySeed(t,i)?0:1);
  for(let r=1;r<=rounds;r++){ pl[r]=[]; for(let j=0;j*2<pl[r-1].length;j++) pl[r][j]=pl[r-1][2*j]+pl[r-1][2*j+1]; }

  // 実出場者へ上から順に行を割り当て（縦詰め）
  let rank=0; const compY=[];
  t.slots.forEach((s,i)=>{ if(!isHiddenBySeed(t,i)){ compY[i]=yOff + rank*pitch + DIM.ph/2; rank++; } });
  const totalRows = Math.max(rank,1);

  // 代表（描画する箱）のツリーを構築：comp=出場者 / match=実際の対戦
  function rep(r,j){
    if(pl[r][j]===0) return null;
    if(r===0) return {kind:'comp', origin:j, y:compY[j]};
    const L=rep(r-1,2*j), R=rep(r-1,2*j+1);
    if(L&&R){ return {kind:'match', col:r, r, j, y:(L.y+R.y)/2, L, R}; }
    return L||R;                       // 片側だけ＝不戦で素通り（繰り上げ）
  }
  const root=rep(rounds,0);

  // 描画（箱は右端 rEdge(col) に揃える＝お尻揃え）
  function drawComp(origin, col, y){
    const box=buildSlot(t, t.slots[origin], origin);
    box.style.left=(rEdge(col)-DIM.pw)+'px'; box.style.top=(y-DIM.ph/2)+'px';
    inner.appendChild(box);
  }
  const skipOther = hideOtherBoxes();
  function drawMatch(node){
    const head = xOf(node.col);                       // 親の頭（ノード位置）
    if(!skipOther){
      const box=winnerBox(nodeContent(t,node.r,node.j));
      box.style.left=head+'px'; box.style.top=(node.y-DIM.oh/2)+'px';
      tagNode(box,t,node.r,node.j);
      inner.appendChild(box);
    }
    drawMatchNo(inner, head, node.y, matchNoMap[t.id+':'+node.r+':'+node.j], t, node.r, node.j);
    const wc=winChildOf(t,node.r,node.j);
    [node.L, node.R].forEach((ch,k)=>{
      if(!ch) return;
      const childCol = (ch.kind==='comp') ? node.col-1 : ch.col;
      if(ch.kind==='comp') drawComp(ch.origin, childCol, ch.y); else drawMatch(ch);
      drawConnector(svg, rEdge(childCol), ch.y, head, node.y, k===wc, undefined, t.id+':'+node.r+':'+node.j);  // 子のお尻→親の頭
    });
  }
  let champCol, champComp=false;
  if(!root){ champCol=0; }
  else if(root.kind==='comp'){ drawComp(root.origin, 0, root.y); champCol=0; champComp=true; }
  else { drawMatch(root); champCol=root.col; }

  // 優勝/代表タグ
  const tag=document.createElement('div'); tag.className='champion-tag';
  tag.textContent = multi ? ('🏅 '+shortRep(t.name)) : '🏆 優勝';
  const champY = root ? root.y : yOff+DIM.ph/2;
  const champLeft = champComp ? (rEdge(champCol)-DIM.pw) : xOf(champCol);
  tag.style.left=champLeft+'px'; tag.style.top=(champY-DIM.oh/2-18)+'px';
  inner.appendChild(tag);

  const champRight = rEdge(champCol);
  return { champRight, champY, right: rEdge(rounds), bottom: yOff + totalRows*pitch };
}

/* 中央決勝（左右対向）：左右から中央の優勝へ。不戦は左右対向でない時と同様に繰り上げ＆縦詰め。 */
function drawCenterTournament(t, xOff, yOff, svg, inner, multi){
  const size=t.size, R=Math.log2(size), pitch=DIM.ph+V_GAP;
  const half=size/2, hr=R-1;
  const skipOther = hideOtherBoxes();
  const hideByes = state.config.hideByes;
  const hasBye = t.slots.some((s,i)=>isHiddenBySeed(t,i));
  const collapse = hideByes && hasBye;
  const lastCol = 2*R;
  const wOf = c=> (c===0||c===lastCol)? DIM.pw : DIM.stepO;
  const X=[]; X[0]=xOff; for(let c=1;c<=lastCol;c++) X[c]=X[c-1]+wOf(c-1)+COL_GAP;
  const baseY = i=> yOff + i*pitch + DIM.ph/2;
  const halfNodes = r=> (size>>r)/2;
  const owDrawn = skipOther?0:DIM.ow;

  function compBox(slotIdx, leftX, y){
    const box = buildSlot(t, t.slots[slotIdx], slotIdx);
    box.style.left=leftX+'px'; box.style.top=(y-DIM.ph/2)+'px';
    inner.appendChild(box);
  }
  function matchBox(leftX, y, r, fullJ, noX){
    if(!skipOther){
      const box = winnerBox(nodeContent(t,r,fullJ));
      box.style.left=leftX+'px'; box.style.top=(y-DIM.oh/2)+'px';
      tagNode(box,t,r,fullJ);
      inner.appendChild(box);
    }
    if(r===R){   // 決勝：番号は箱の中央、勝ち数は左右
      const cx=leftX+owDrawn/2, off=skipOther?19:(owDrawn/2+12);
      drawMatchNo(inner, cx, y, matchNoMap[t.id+':'+r+':'+fullJ], t, r, fullJ, off);
    } else {
      drawMatchNo(inner, (noX===undefined?leftX:noX), y, matchNoMap[t.id+':'+r+':'+fullJ], t, r, fullJ);  // 交点側に番号
    }
  }

  // 片サイドを構築（描画は draw(yShift) で実行）。side: 'L'=右向き / 'R'=左向き。
  function buildHalfCollapsed(slotStart, side){
    const pl=[]; pl[0]=[]; for(let i=0;i<half;i++) pl[0][i]=isHiddenBySeed(t,slotStart+i)?0:1;
    for(let r=1;r<=hr;r++){ pl[r]=[]; for(let j=0;j*2<pl[r-1].length;j++) pl[r][j]=pl[r-1][2*j]+pl[r-1][2*j+1]; }
    let rank=0; const compY=[];
    for(let i=0;i<half;i++){ if(!isHiddenBySeed(t,slotStart+i)){ compY[i]=baseY(rank); rank++; } }
    function rep(r,j){ if(pl[r][j]===0) return null;
      if(r===0) return {kind:'comp', origin:slotStart+j, y:compY[j]};
      const L=rep(r-1,2*j), Rn=rep(r-1,2*j+1);
      if(L&&Rn) return {kind:'match', depth:r, localJ:j, y:(L.y+Rn.y)/2, L, R:Rn};
      return L||Rn; }
    const root=rep(hr,0);
    const rootY = root? root.y : baseY(0);
    const colOf = d=> side==='L'? d : (lastCol-d);
    const innerEdge = d=>{ const c=colOf(d); return side==='L'? ((d===0)?X[0]+DIM.pw:X[c]+DIM.stepO) : X[c]; };
    function draw(sh){
      function drawComp(node,d){ const c=colOf(d);
        compBox(node.origin, side==='L'?(innerEdge(d)-DIM.pw):X[c], node.y+sh); }
      function drawM(node){ const d=node.depth, c=colOf(d);
        const fullJ=side==='L'?node.localJ:(halfNodes(d)+node.localJ);
        const pe = side==='L'? X[c] : (X[c]+owDrawn);
        const noX = side==='L'? pe : pe + COL_GAP/8;        // 右側は番号・勝ち数を交点側へ少し寄せる
        matchBox(X[c], node.y+sh, d, fullJ, noX);
        const wc=winChildOf(t,d,fullJ);
        [node.L,node.R].forEach((ch,k)=>{ if(!ch)return;
          const cd=(ch.kind==='comp')?d-1:ch.depth;
          if(ch.kind==='comp') drawComp(ch,cd); else drawM(ch);
          drawConnector(svg, innerEdge(cd), ch.y+sh, pe, node.y+sh, k===wc, undefined, t.id+':'+d+':'+fullJ); });
      }
      if(!root) return {y:baseY(0)+sh, edge: side==='L'?X[0]+DIM.pw:X[lastCol]};
      if(root.kind==='comp'){ drawComp(root,0); return {y:root.y+sh, edge:innerEdge(0)}; }
      drawM(root); return {y:root.y+sh, edge:innerEdge(root.depth)};
    }
    return {rootY, draw};
  }
  function buildHalfFull(slotStart, side){
    const c=[[]]; for(let i=0;i<half;i++) c[0][i]=baseY(i);
    for(let r=1;r<=hr;r++){ c[r]=[]; for(let j=0;j*2<c[r-1].length;j++) c[r][j]=(c[r-1][2*j]+c[r-1][2*j+1])/2; }
    const colOf=d=> side==='L'?d:(lastCol-d);
    const innerEdge=d=>{ const cc=colOf(d); return side==='L'?X[cc]+wOf(cc):X[cc]; };
    return { rootY:c[hr][0], draw:(sh)=>{
      for(let i=0;i<half;i++){ if(hideByes&&isHiddenBySeed(t,slotStart+i))continue; compBox(slotStart+i, X[colOf(0)], c[0][i]+sh); }
      for(let r=1;r<=hr;r++){ const cc=colOf(r); c[r].forEach((cy,j)=>{
        const fullJ=side==='L'?j:(halfNodes(r)+j); const pe=side==='L'?X[cc]:(X[cc]+owDrawn);
        const noX = side==='L'? pe : pe + COL_GAP/8;        // 右側は番号・勝ち数を交点側へ少し寄せる
        matchBox(X[cc], cy+sh, r, fullJ, noX);
        const wc=winChildOf(t,r,fullJ);
        [2*j,2*j+1].forEach((ci,k)=>{ if(r===1&&hideByes&&isHiddenBySeed(t,slotStart+ci))return;
          drawConnector(svg, innerEdge(r-1), c[r-1][ci]+sh, pe, cy+sh, k===wc, undefined, t.id+':'+r+':'+fullJ); });
      }); }
      return {y:c[hr][0]+sh, edge:innerEdge(hr)};
    }};
  }

  // 左右を構築 → 決勝進出者の高さを揃えてから描画（決勝の線が一直線になる）
  const bL = collapse?buildHalfCollapsed(0,'L'):buildHalfFull(0,'L');
  const bR = collapse?buildHalfCollapsed(half,'R'):buildHalfFull(half,'R');
  const centerY = Math.max(bL.rootY, bR.rootY);
  const leftRoot  = bL.draw(centerY - bL.rootY);
  const rightRoot = bR.draw(centerY - bR.rootY);

  // 決勝（中央）— 左右finalist と同じ高さなので一直線
  matchBox(X[R], centerY, R, 0, X[R]);
  const fwc=winChildOf(t,R,0);
  drawConnector(svg, leftRoot.edge, centerY, X[R], centerY, fwc===0, undefined, t.id+':'+R+':0');
  drawConnector(svg, rightRoot.edge, centerY, X[R]+owDrawn, centerY, fwc===1, undefined, t.id+':'+R+':0');
  // 交点から上へ短い線（優勝を明示）。決着済みなら勝者色。
  {
    const cx=X[R]+owDrawn/2, topY=centerY-(skipOther?0:DIM.oh/2);
    const done=occupant(t,R,0)!=null;
    const vp=document.createElementNS(SVGNS,'path'); vp.setAttribute('d', `M${cx},${topY} V${topY-24}`);
    if(done){ vp.setAttribute('class','win'); _winPaths.push({svg,p:vp}); } else svg.appendChild(vp);
  }

  const tag=document.createElement('div'); tag.className='champion-tag';
  tag.textContent = multi ? ('🏅 '+shortRep(t.name)) : '🏆 優勝';
  const cxTag=X[R]+owDrawn/2, lineTopY=(centerY-(skipOther?0:DIM.oh/2))-24;
  tag.style.left=(cxTag-22)+'px'; tag.style.top=(lineTopY-16)+'px';   // 伸ばした線のさらに上に表示
  inner.appendChild(tag);

  return { champRight:X[lastCol]+DIM.pw, champY:centerY, right:X[lastCol]+DIM.pw, bottom: yOff + half*pitch };
}

/* 各トーナメントの代表が戦う「代表トーナメント」を右側に描画（運用対応）。 */
function drawRepTournament(champs, xOff, svg, inner){
  const rt=state.repT; if(!rt) return {right:xOff, bottom:0};
  const count=champs.length, pitch=DIM.oh+V_GAP;
  const repSize=rt.size, rounds=Math.log2(repSize);
  // round0は代表枠(幅DIM.ow)。round>=1は枠なし＝列幅0で詰める（線が途切れない）。
  const xOf=(r)=> r===0 ? xOff : (xOff + DIM.ow + COL_GAP + (r-1)*COL_GAP);
  const childEdge=(r)=> r===0 ? (xOff+DIM.ow) : xOf(r);   // 子の右端（round0=箱の右／以降=交点）
  const run=runView();

  const ys=[];
  for(let i=0;i<repSize;i++){
    if(state.stacked && champs[i]) ys[i]=champs[i].y;
    else if(state.stacked && i>0) ys[i]=ys[i-1]+pitch*2.2;
    else ys[i] = 40 + i*pitch*2.2 + DIM.oh/2;
  }
  const centers=[ys.slice()];
  for(let r=1;r<=rounds;r++){ const prev=centers[r-1]; centers[r]=[];
    for(let j=0;j*2<prev.length;j++) centers[r][j]=(prev[j*2]+prev[j*2+1])/2; }

  const title=document.createElement('div'); title.className='tname'; title.textContent='代表トーナメント';
  title.style.left=xOf(0)+'px'; title.style.top=(Math.min(...ys)-40)+'px'; inner.appendChild(title);

  // round0 代表スロット（運用は優勝者名／作成はTn代表）
  for(let i=0;i<repSize;i++){
    const named = i<count;
    const champ = named ? champOf(i) : null;
    const label = (run && champ) ? champ.name : (named ? (state.tournaments[i].name+'代表') : '（不在）');
    const box=repColoredBox(label, i%2===0?rt.colorTop:rt.colorBottom);
    box.style.left=xOf(0)+'px'; box.style.top=(ys[i]-DIM.oh/2)+'px';
    inner.appendChild(box);
    if(champs[i]) drawConnector(svg, champs[i].x, champs[i].y, xOf(0), ys[i]);
  }
  // round>=1：その他枠は「なし」（線と試合番号のみ。勝者枠は描かない）
  for(let r=1;r<=rounds;r++){
    centers[r].forEach((cy,j)=>{
      drawMatchNo(inner, xOf(r), cy, matchNoMap['REP:'+r+':'+j], rt, r, j);
    });
    centers[r].forEach((cy,j)=>{
      const wc=winChildOf(rt,r,j);
      [j*2,j*2+1].forEach((ci,k)=> drawConnector(svg, childEdge(r-1), centers[r-1][ci], xOf(r), cy, k===wc, undefined, 'REP:'+r+':'+j));
    });
  }
  const tag=document.createElement('div'); tag.className='champion-tag'; tag.textContent='🏆 総合優勝';
  tag.style.left=xOf(rounds)+'px'; tag.style.top=(centers[rounds][0]-DIM.oh/2-18)+'px'; inner.appendChild(tag);

  // 順位表（総合優勝・準優勝）を右側に
  const so=state.config.standOffset||{dx:0,dy:0};
  const rows=placementRows(rt, false, '総合優勝');
  const sb=drawStandingsBox(inner, xOf(rounds)+DIM.ow+COL_GAP*2+so.dx, (Math.min(...ys)-6)+so.dy, rows, '🏆 順位');
  return { right: Math.max(xOf(rounds)+DIM.ow, sb.right), bottom: Math.max(Math.max(...ys)+DIM.oh, sb.bottom) };
}

/* 代表リーグ戦：総当たりを「2名トーナメント×3」を縦に並べて表示。
 *  順位：①勝ち数が多い ②負け数が少ない ③総試合時間が短い 順。 */
function drawRepLeague(champs, xOff, svg, inner){
  const count=champs.length;
  const tn=state.tournaments;
  const run=runView();
  if(!state.repLeague) state.repLeague={};
  const w=DIM.pw, h=DIM.ph, pitch=h+V_GAP, gap=COL_GAP;
  const x0=xOff, x1=xOff+w+gap;                       // 代表列 / 勝者列
  const nm=(i,c)=> (run&&c)?c.name : (tn[i].name+'代表');
  const pairs=[]; for(let a=0;a<count;a++) for(let b=a+1;b<count;b++) pairs.push([a,b]);

  const title=document.createElement('div'); title.className='tname'; title.textContent='代表リーグ戦';
  title.style.left=x0+'px'; title.style.top='2px'; inner.appendChild(title);

  let y=36, bottom=0;
  pairs.forEach(([a,b])=>{
    const yTop=y+h/2, yBot=yTop+pitch, yMid=(yTop+yBot)/2;
    const res=state.repLeague[a+'-'+b];
    const wc=(res && res.win!=null && res.kind!=='勝者なし') ? res.win : -1;
    const ca=champOf(a), cb=champOf(b);
    const bA=repColoredBox(nm(a,ca), 0, w, h, DIM.pfs); bA.style.left=x0+'px'; bA.style.top=(yTop-h/2)+'px'; inner.appendChild(bA);
    const bB=repColoredBox(nm(b,cb), 1, w, h, DIM.pfs); bB.style.left=x0+'px'; bB.style.top=(yBot-h/2)+'px'; inner.appendChild(bB);
    const winName = wc===0?nm(a,ca):(wc===1?nm(b,cb):'');
    if(winName){   // 勝者枠は決着時のみ（空欄の枠は出さず線を詰める）
      const wbox=repColoredBox(winName, wc===0?0:1, w, h, DIM.pfs); wbox.style.left=x1+'px'; wbox.style.top=(yMid-h/2)+'px'; inner.appendChild(wbox);
    }
    const bendX=x0+w+12;                               // 交点を対戦者側へ寄せる（試合番号と重ならない）
    drawConnector(svg, x0+w, yTop, x1, yMid, wc===0, bendX, 'LG:'+a+':'+b);
    drawConnector(svg, x0+w, yBot, x1, yMid, wc===1, bendX, 'LG:'+a+':'+b);
    drawLeagueMatchNo(inner, x1, yMid, matchNoMap['LG:'+a+':'+b], a, b);
    bottom=Math.max(bottom, yBot+h/2);
    y = yBot + h/2 + 36;                               // 次のミニトーナメントへ
  });

  // 順位：勝ち数=取った本数(2-1なら2)、負け数=取られた本数。①本勝多 ②本負少 ③総試合時間短
  const wins=Array(count).fill(0), losses=Array(count).fill(0), ttime=Array(count).fill(0);
  pairs.forEach(([a,b])=>{ const r=state.repLeague[a+'-'+b];
    if(r && r.kind){
      const tsec=parseTime(r.time); ttime[a]+=tsec; ttime[b]+=tsec;
      if(r.kind!=='勝者なし'){
        const [ws,ls]=setsOf(r.kind);              // [勝者の取得本数, 敗者の取得本数]
        const wn=r.win===0?a:b, lo=r.win===0?b:a;
        wins[wn]+=ws; losses[wn]+=ls;
        wins[lo]+=ls; losses[lo]+=ws;
      }
    } });
  const order=[...Array(count).keys()].sort((p,q)=> wins[q]-wins[p] || losses[p]-losses[q] || ttime[p]-ttime[q]);
  const so=state.config.standOffset||{dx:0,dy:0};
  const xStand=x1+w+COL_GAP*2 + so.dx, yStandTop=16 + so.dy;
  const rows=order.map((i,rank)=>{ const champ=champOf(i);
    return { label:(rank+1)+'位', name:nm(i,champ), record: wins[i]+'勝'+losses[i]+'敗 '+fmtTime(ttime[i]) }; });
  const sb=drawStandingsBox(inner, xStand, yStandTop, rows, '🏆 順位（本勝→本負→時間）');
  return { right: sb.right, bottom: Math.max(bottom, sb.bottom) };
}
/* 勝ち方→[勝者の取得本数, 敗者の取得本数] */
function setsOf(kind){
  return {'1-0勝ち':[1,0], '2-0勝ち':[2,0], '2-1勝ち':[2,1], '不戦勝':[1,0]}[kind] || [0,0];
}
/* 順位表のドラッグ移動（全体共通 state.config.standOffset）。 */
function startStandDrag(e){
  e.preventDefault();
  if(!state.config.standOffset) state.config.standOffset={dx:0,dy:0};
  const o=state.config.standOffset;
  const d={sx:e.clientX, sy:e.clientY, ox:o.dx, oy:o.dy};
  const mv=(ev)=>{ const z=state.config.zoom||1;
    state.config.standOffset.dx=d.ox+(ev.clientX-d.sx)/z;
    state.config.standOffset.dy=d.oy+(ev.clientY-d.sy)/z; renderBracket(); };
  const up=()=>{ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); };
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
}
/* 代表リーグの試合番号＋勝ち数（クリックで結果入力）。上=team a(色0) / 下=team b(色1)。 */
function drawLeagueMatchNo(inner, x, y, n, a, b){

/* リーグ戦の1対戦を選択 */

/* タイトル要素のその場改名 */

function buildSlot(t, slot, i){
