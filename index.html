/* スロット間のドラッグ＆ドロップで player を入れ替える */
let dragSrc = null;     // {tid, idx}
function enableDnD(box, t, i){
  box.draggable = true;
  box.addEventListener('dragstart', (e)=>{ dragSrc={tid:t.id, idx:i};
    box.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
  box.addEventListener('dragend', ()=> box.classList.remove('dragging'));
  box.addEventListener('dragover', (e)=>{ if(dragSrc){ e.preventDefault(); box.classList.add('drop-target'); } });
  box.addEventListener('dragleave', ()=> box.classList.remove('drop-target'));
  box.addEventListener('drop', (e)=>{
    e.preventDefault(); box.classList.remove('drop-target');
    if(!dragSrc || (dragSrc.tid===t.id && dragSrc.idx===i)){ dragSrc=null; return; }
    if(!confirmIfResults('試合後に選手を入れ替えると入力済みの結果と矛盾します。続けますか？')){ dragSrc=null; renderAll(); return; }
    const src = state.tournaments.find(x=>x.id===dragSrc.tid);
    if(src) swapSlots(src, dragSrc.idx, t, i);
    dragSrc=null; renderAll();
  });
}

/* スロット入れ替え。中身（player と seed）をまとめて交換する。
 *  → シード選手を動かすとシード指定も付いてくる。
 *    不戦枠（seed=normal）を動かしても相手のシードは動かない。 */
function swapSlots(srcT, srcI, tgtT, tgtI){
  const a=srcT.slots[srcI], b=tgtT.slots[tgtI];
  [a.player, b.player] = [b.player, a.player];
  [a.seed,   b.seed]   = [b.seed,   a.seed];
}

/* シード枠の「初戦の相手」を不戦扱いで隠す:
 *  ペア(2k,2k+1)の一方がseedなら、他方を不戦表示にする。 */
function isHiddenBySeed(t, i){
  const partner = i ^ 1;                    // 同一ペアの相手
  const me = t.slots[i], op = t.slots[partner];
  if(!op) return false;
  return op.seed==='seed' && me.seed!=='seed';
}

/* ============================================================
 *  運用フェーズ: 進行ロジック
 * ============================================================ */
const RESULT_KINDS = ['1-0勝ち','2-0勝ち','2-1勝ち','不戦勝','勝者なし'];
// 勝ち方のグループと短縮表示
const KIND_GROUPS = [
  {label:'1本先取', kinds:['1-0勝ち']},
  {label:'2本先取', kinds:['2-0勝ち','2-1勝ち']},
  {label:'その他',  kinds:['不戦勝','勝者なし']},
];
const KIND_SHORT = {'1-0勝ち':'1-0', '2-0勝ち':'2-0', '2-1勝ち':'2-1', '不戦勝':'不戦勝', '勝者なし':'勝者なし'};

/* ノード(r,j)の部分木に「実在の出場者」が1人でもいるか（バイか未決着かの区別用）。 */
function subtreeHasComp(t, r, j){
  if(r===0){
    if(isHiddenBySeed(t,j)) return false;
    const s=t.slots[j];
    return !!(s && s.player && s.player.playerName);
  }
  return subtreeHasComp(t, r-1, 2*j) || subtreeHasComp(t, r-1, 2*j+1);
}
/* ノード(r,j)の占有者＝出場者の元スロット番号を返す（未決定/空は null）。
 *  片側の部分木が「完全に空」のときだけバイ進出。両側に出場者がいて未入力なら null
 *  （＝シードが対戦相手未決のまま貫通するのを防ぐ）。 */
function occupant(t, r, j){
  if(r===0){
    const s=t.slots[j];
    if(isHiddenBySeed(t,j)) return null;                 // 不戦枠そのものは出場者でない
    return (s && s.player && s.player.playerName) ? j : null;
  }
  const h0=subtreeHasComp(t, r-1, 2*j), h1=subtreeHasComp(t, r-1, 2*j+1);
  if(!h0 && !h1) return null;                            // 両側とも空
  if(h0 && !h1) return occupant(t, r-1, 2*j);            // 右が空＝バイ（左が決まっていれば進出）
  if(!h0 && h1) return occupant(t, r-1, 2*j+1);          // 左が空＝バイ
  const c0=occupant(t, r-1, 2*j), c1=occupant(t, r-1, 2*j+1);
  if(c0==null || c1==null) return null;                  // 両側に出場者ありだが未決定
  const res = t.results && t.results[r+'-'+j];
  if(!res || res.win==null || res.kind==='勝者なし') return null;
  return res.win===0 ? c0 : c1;
}

/* 試合(r,j)の敗者の元スロット番号（決着済みのみ。未決着/バイ/勝者なしは null）。 */
function loserOf(t, r, j){
  const res = t.results && t.results[r+'-'+j];
  if(!res || res.win==null || res.kind==='勝者なし') return null;
  const c0=occupant(t, r-1, 2*j), c1=occupant(t, r-1, 2*j+1);
  if(c0==null || c1==null) return null;                  // 片方バイ＝敗者なし
  return res.win===0 ? c1 : c0;
}

/* 勝者枠の表示内容：運用は占有者（勝ち上がった選手）名、作成は「勝者」。 */
function nodeContent(t, r, j){
  if(runView()){ const c=competitorOf(t, occupant(t,r,j)); return c ? (c.name||'') : ''; }
  return '勝者';
}
/* 運用時、勝者枠に座標を持たせて進行アニメーションの対象にする。 */
function tagNode(box, t, r, j){
  if(runView()){ box.dataset.tid=t.id; box.dataset.r=r; box.dataset.j=j; box.classList.add('runwin'); }
}

/* 元スロット番号から表示名・色を得る */
function competitorOf(t, origin){
  if(origin==null) return null;
  const s=t.slots[origin]; const p=(s&&s.player)||{};
  return { origin, name:p.playerName||'', aff:p.affiliation||'', num:p.number||'',
           colorIdx:(origin%2===0)?t.colorTop:t.colorBottom };
}

/* ===== 代表トーナメント/リーグ（複数トーナメントの優勝者で争う） ===== */
function tournById(id){ return id==='REP' ? state.repT : state.tournaments.find(x=>x.id===id); }
/* トーナメントiの優勝者（決定済みなら competitor、未定なら null） */
function champOf(i){ const t=state.tournaments[i]; if(!t) return null;
  return competitorOf(t, occupant(t, Math.log2(t.size), 0)); }
/* 代表トーナメント repT を最新の優勝者で同期（results は保持）。複数時のみ。 */
function syncRepTournament(){
  const n=state.tournaments.length;
  if(n<=1){ state.repT=null; return; }
  const repSize = n<=2 ? 2 : 4;
  if(!state.repT || state.repT.size!==repSize){
    state.repT = { id:'REP', name:'代表', size:repSize, colorTop:0, colorBottom:1,
      slots:Array.from({length:repSize},()=>({player:null,seed:'normal'})),
      results:(state.repT&&state.repT.results)||{} };
  }
  for(let i=0;i<repSize;i++){
    const c = i<n ? champOf(i) : null;
    state.repT.slots[i].player = c ? {playerName:c.name, affiliation:c.aff, number:c.num} : null;
  }
}

/* ===== 試合キー（matchNoMap準拠）から結果・概要を取得 ===== */
function matchKeyResult(key){
  if(key.slice(0,3)==='LG:'){ const p=key.slice(3).split(':'); return state.repLeague[p[0]+'-'+p[1]]; }
  if(key.slice(0,4)==='REP:'){ const p=key.slice(4).split(':'); return state.repT ? state.repT.results[p[0]+'-'+p[1]] : null; }
  const i=key.indexOf(':'); const t=tournById(+key.slice(0,i)); if(!t) return null;
  const rest=key.slice(i+1);
  if(rest==='3rd') return t.results['3rd'];
  const p=rest.split(':'); return t.results[p[0]+'-'+p[1]];
}
function matchDecided(key){ const r=matchKeyResult(key); return !!(r && r.kind); }   // 結果入力済み＝実施済み
function _nameAt(t,r,j){ const c=competitorOf(t, occupant(t,r,j)); return c?(c.name||'未定'):'未定'; }
function _nameOrigin(t,o){ const c=(o!=null)?competitorOf(t,o):null; return c?(c.name||'未定'):'未定'; }
/* 試合キー→{no,a,b,label}（下部バー表示用） */
function matchBrief(key){
  const no=matchNoMap[key], tn=state.tournaments;
  if(key.slice(0,3)==='LG:'){ const [a,b]=key.slice(3).split(':').map(Number);
    const ca=champOf(a), cb=champOf(b);
    return {no, a:(ca?ca.name:tn[a].name+'代表'), b:(cb?cb.name:tn[b].name+'代表'), label:'代表リーグ'};
  }
  if(key.slice(0,4)==='REP:'){ const p=key.slice(4).split(':').map(Number); const rt=state.repT, r=p[0],j=p[1];
    if(!rt) return {no, a:'未定', b:'未定', label:'代表'};
    const isF=(r===Math.log2(rt.size));
    return {no, a:_nameAt(rt,r-1,2*j), b:_nameAt(rt,r-1,2*j+1), label:'代表'+(isF?'決勝':'戦')};
  }
  const i=key.indexOf(':'); const t=tournById(+key.slice(0,i)), rest=key.slice(i+1);
  const bn = (state.tournaments.length>1) ? t.name+' ' : '';   // 単独トーナメントはブロック名を出さない
  if(rest==='3rd'){ const sf=Math.log2(t.size)-1;
    return {no, a:_nameOrigin(t,loserOf(t,sf,0)), b:_nameOrigin(t,loserOf(t,sf,1)), label:bn+'3位決定戦'};
  }
  const p=rest.split(':').map(Number); const r=p[0],j=p[1], rounds=Math.log2(t.size);
  return {no, a:_nameAt(t,r-1,2*j), b:_nameAt(t,r-1,2*j+1), label:bn+(r===rounds?'決勝':'第'+r+'回戦')};
}

/* ===== 順位表（共通描画）。rows=[{label,name,record?}] ===== */
function drawStandingsBox(inner, xStand, yTop, rows, title){
  const h=DIM.ph, pitch=h+V_GAP, standW=DIM.pw;
  // 画面外に出ない様クランプ＋offset書き戻し（順位ラベルは枠の左52pxに出るので余白確保）
  const so=state.config.standOffset||(state.config.standOffset={dx:0,dy:0});
  if(xStand<54){ so.dx+=54-xStand; xStand=54; }
  if(yTop<2){ so.dy+=2-yTop; yTop=2; }
  const st=document.createElement('div'); st.className='champion-tag qz';
  st.textContent=title + (viewMode?'':'（ドラッグで移動）');
  st.style.left=xStand+'px'; st.style.top=yTop+'px';
  if(!viewMode){ st.style.cursor='move'; st.onpointerdown=(e)=>startStandDrag(e); }
  inner.appendChild(st);
  const txt=(s,x,yy)=>{ const d=document.createElement('div'); d.className='champion-tag qz'; d.textContent=s;
    d.style.color='var(--text)'; d.style.left=x+'px'; d.style.top=yy+'px'; inner.appendChild(d); };
  rows.forEach((row,idx)=>{
    const yRow=yTop+18+idx*pitch;
    txt(row.label, xStand-52, yRow+(h-14)/2);                       // 順位ラベル（枠外左・通常太さ）
    const box=document.createElement('div'); box.className='slot qz'; box.style.cursor='default';
    box.innerHTML='<span class="name" style="font-weight:700;font-size:'+(DIM.pfs+2)+'px;padding:0 8px">'+esc(row.name||'')+'</span>';
    box.style.left=xStand+'px'; box.style.top=yRow+'px'; box.style.width=standW+'px'; box.style.height=h+'px'; box.style.fontSize=DIM.pfs+'px';
    inner.appendChild(box);
    if(row.record) txt(row.record, xStand+standW+8, yRow+(h-14)/2);  // 戦績（枠外右）
  });
  return { right: xStand+standW+120, bottom: yTop+18+rows.length*pitch };
}
/* トーナメント（単独/代表）の順位行：優勝・準優勝・(3位)。 */
function placementRows(t, hasThird, topLabel){
  const rounds=Math.log2(t.size);
  const champ=competitorOf(t, occupant(t,rounds,0));
  const rl=loserOf(t,rounds,0), runner=(rl!=null)?competitorOf(t,rl):null;
  const rows=[{label:topLabel, name:champ?champ.name:''}, {label:'準優勝', name:runner?runner.name:''}];
  if(hasThird){
    const sf=rounds-1, res=t.results && t.results['3rd'];
    let n3='';
    if(res && res.win!=null && res.kind!=='勝者なし'){ const w=res.win===0?loserOf(t,sf,0):loserOf(t,sf,1); const c=(w!=null)?competitorOf(t,w):null; n3=c?c.name:''; }
    rows.push({label:'3位', name:n3});
  }
  return rows;
}

/* 運用フェーズの1ノード。r<rounds はクリックで結果入力。 */
function runNode(t, r, j, rounds){
  const cfg=state.config;
  const origin=occupant(t,r,j), comp=competitorOf(t,origin);
  const box=document.createElement('div');
  const sel = state.runSel && state.runSel.tid===t.id && state.runSel.r===r && state.runSel.idx===j;
  // この枠が自分の試合の勝者か
  let wonHere=false, kindHere='';
  if(r<rounds){ const res=t.results[(r+1)+'-'+(j>>1)];
    if(res && res.win===(j&1) && res.kind!=='勝者なし'){ wonHere=true; kindHere=res.kind; } }
  box.className='slot run'+(comp?'':' winner')+(sel?' selected':'')+(wonHere?' won':'');
  box.style.height=DIM.oh+'px'; box.style.fontSize=DIM.ofs+'px';
  box.dataset.tid=t.id; box.dataset.r=r; box.dataset.j=j;
  const nm = comp ? esc(comp.name||'（無名）') : (r===rounds?'🏆':'—');
  const numHtml=(cfg.showNumber && comp && comp.num)?'<span class="num">'+esc(comp.num)+'</span>':'';
  const affHtml=(cfg.showAff && comp && comp.aff)?'<span class="sub">'+esc(comp.aff)+'</span>':'';
  const kindBadge=wonHere?'<span class="badge win">'+esc(kindHere)+'</span>':'';
  box.innerHTML='<span class="stripe"></span>'+numHtml+
    '<span class="name'+(comp?'':' empty')+'">'+nm+affHtml+'</span>'+kindBadge;
  box.querySelector('.stripe').style.background = comp ? paletteHex(comp.colorIdx) : 'var(--line)';
  if(r<rounds){ box.style.cursor='pointer';
    box.onclick=()=>{ openRunMatch(t, r, j); }; }
  return box;
}

/* 試合(mr,mj)＝ラウンドmrのmj番ノードを生む対戦。番号クリックで開く。 */
function openRunMatch(t, mr, mj){
  state.runSel = { tid:t.id, mr, mj }; state.sel=null;
  const res = t.results[mr+'-'+mj];
  state.pending = res ? {win:res.win, kind:res.kind, time:res.time||''} : {win:null, kind:null, time:''};
  renderAll();
}

/* ============================================================

function renderInspector(){

/* 呼出（別システム連携用のフック）。現状はトースト表示。CALL_ENDPOINT を設定すると番号をPOST。 */
const CALL_ENDPOINT='';   // 例: 'https://xxxx.trycloudflare.com/call'（line-call-system）
function callPlayer(p){
  const num=(p&&p.number)||'', name=(p&&p.playerName)||'(空き)';
  if(CALL_ENDPOINT && num){
    fetch(CALL_ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({number:num, name})})
      .then(()=> toast('呼出を送信: '+name)).catch(()=> toast('呼出の送信に失敗', true));
  } else {
    toast('呼出: '+name+(num?'（No.'+num+'）':'')+'（連携先未設定）');
  }
}

/* 選択中の試合のコンテキスト（ブラケット=代表含む / リーグ を統一的に扱う） */
function runMatchCtx(){
  const sel=state.runSel;
  if(sel.third){
    const t=tournById(sel.tid), rounds=Math.log2(t.size), sf=rounds-1;
    return { a:competitorOf(t, loserOf(t,sf,0)), b:competitorOf(t, loserOf(t,sf,1)),
      colTop:paletteHex(t.colorTop), colBot:paletteHex(t.colorBottom),
      resObj:t.results, key:'3rd', no:matchNoMap[t.id+':3rd'], noKey:t.id+':3rd',
      title:esc(t.name)+' ／ 3位決定戦', animate:null };
  }
  if(sel.league){
    const A=sel.a, B=sel.b;
    return { a:champOf(A), b:champOf(B), colTop:paletteHex(0), colBot:paletteHex(1),
      resObj:state.repLeague, key:A+'-'+B, no:matchNoMap['LG:'+A+':'+B], noKey:'LG:'+A+':'+B,
      title:'代表リーグ ／ '+esc(state.tournaments[A].name)+'代表 × '+esc(state.tournaments[B].name)+'代表',
      animate:null };
  }
  const t=tournById(sel.tid), mr=sel.mr, mj=sel.mj;
  const isFinal=(mr===Math.log2(t.size)), pre=(t.id==='REP')?'代表 ':'';
  const noKey=(t.id==='REP'?'REP':t.id)+':'+mr+':'+mj;
  return { a:competitorOf(t, occupant(t,mr-1,2*mj)), b:competitorOf(t, occupant(t,mr-1,2*mj+1)),
    colTop:paletteHex(t.colorTop), colBot:paletteHex(t.colorBottom),
    resObj:t.results, key:mr+'-'+mj, no:matchNoMap[t.id+':'+mr+':'+mj], noKey,
    title:esc(t.name)+' ／ '+pre+(isFinal?'決勝':'第'+mr+'回戦'),
    animate:()=>animateAdvance(t, mr, mj) };
}

/* 運用フェーズのインスペクタ（結果入力パネル） */

  el.innerHTML = `

      <h2>勝ち方</h2>
      ${KIND_GROUPS.map(g=>`<div class="kind-group"><span class="kg-label">${g.label}</span><div class="kinds">${
        g.kinds.map(k=>`<button class="kind ${pend.kind===k?'active':''}" data-kind="${k}">${KIND_SHORT[k]||k}</button>`).join('')
      }</div></div>`).join('')}
      ${timeRow}
    </div>
    <button class="btn primary" id="btnSend" style="width:100%">${resObj[key]?'再送信':'送信'}</button>
    <button class="btn sm" id="btnNextUp" style="width:100%; margin-top:8px" ${resObj[key]?'disabled':''}>${(state.priority&&state.priority.includes(ctx.noKey))?'次の試合にする解除':'この試合を次の試合にする'}</button>
    <button class="btn sm" id="btnSpotlight" style="width:100%; margin-top:8px">対戦カード演出</button>
    <button class="btn sm" id="btnSkip" style="width:100%; margin-top:8px" ${resObj[key]?'disabled':''}>${(state.skipped&&state.skipped[ctx.noKey])?'スキップ解除':'この試合をスキップする'}</button>
    ${resObj[key]?'<button class="btn sm danger" id="btnClearResult" style="width:100%; margin-top:8px">結果を取り消す（未送信に戻す）</button>':''}
  `;
  el.querySelectorAll('[data-win]').forEach(btn=> btn.onclick=()=>{ pend.win=+btn.dataset.win; state.pending=pend; renderRunInspector(el); });
  el.querySelectorAll('[data-kind]').forEach(btn=> btn.onclick=()=>{ pend.kind=btn.dataset.kind;
    if(pend.kind==='勝者なし') pend.win=null; state.pending=pend; renderRunInspector(el); });
  const tin=document.getElementById('pendTime'); if(tin) tin.oninput=()=>{ pend.time=tin.value; };
  const sw=document.getElementById('swBtn'); if(sw) sw.onclick=()=>toggleStopwatch();
  document.getElementById('btnSend').onclick=()=> sendResultCtx(ctx);
  document.getElementById('btnSpotlight').onclick=()=> showSpotlightCtx(ctx);
  const bc=document.getElementById('btnClearResult'); if(bc) bc.onclick=()=> clearResultCtx(ctx);
  document.getElementById('btnSkip').onclick=()=>{
    if(!state.skipped) state.skipped={};
    const oldNext=nextMatchKey();                                       // 変更前の次の試合
    if(state.skipped[ctx.noKey]) delete state.skipped[ctx.noKey]; else state.skipped[ctx.noKey]=true;
    renderAll();
    const nk=nextMatchKey();
    if(nk && nk!==oldNext) spotlightForKey(nk, '次の試合');             // 次の試合が変わったときだけ演出

      delete (state.skipped||{})[ctx.noKey];                            // スキップ中なら解除
    }
    renderAll();
    const nk=nextMatchKey();
    if(nk && nk!==oldNext) spotlightForKey(nk, '次の試合');             // 次の試合が変わったら演出
  };
}

/* 結果を取り消して未送信（未実施）に戻す。保存して閲覧側にも反映。 */
function clearResultCtx(ctx){
  const {resObj,key}=ctx;
  if(!resObj[key]) return;
  if(!confirm('この試合の結果を取り消して未送信に戻しますか？')) return;
  delete resObj[key];
  state.pending={win:null, kind:null, time:''};
  renderAll();
  const k=document.getElementById('docKey').value||'default';
  Backend.save(k, JSON.stringify(state)).then(()=>markSaved()).catch(()=>{});
  toast('結果を取り消しました（未送信に戻しました）');
}
/* 結果送信：GASからOKを受けてから進行＆アニメーション。 */
function sendResultCtx(ctx){
  const pend=state.pending||{};
  if(pend.kind==null){ toast('勝ち方を選んでください', true); return; }
  if(pend.kind!=='勝者なし' && pend.win==null){ toast('勝者を選んでください', true); return; }
  const {resObj,key,animate}=ctx;
  const prev=resObj[key];
  resObj[key] = {win:pend.win, kind:pend.kind, time:pend.time||''};
  const json=JSON.stringify(state);               // 送信用に確定状態を作る
  resObj[key]=prev;                                // OKまでは未確定に戻す
  toast('送信中…');
  const oldNext=nextMatchKey();                     // 確定前の「次の試合」
  Backend.submitResult(document.getElementById('docKey').value||'default', json).then(res=>{
    if(res && res.ok){
      resObj[key] = {win:pend.win, kind:pend.kind, time:pend.time||''};   // 確定
      stopStopwatch();
      renderAll();
      toast('送信OK・進行しました');
      const nk=nextMatchKey();
      const nextChanged = nk && nk!==oldNext;        // 次の試合が変わったときだけカード演出
      const hasWin = pend.kind!=='勝者なし';
      if(hasWin){
        if(animate) animate();
        showAdvanceCtx({a:ctx.a, b:ctx.b, win:pend.win, colTop:ctx.colTop, colBot:ctx.colBot, noKey:ctx.noKey});  // ①勝ち上がり演出
        if(nextChanged) setTimeout(()=> spotlightForKey(nk, '次の試合'), ADV_MS+CARD_GAP);    // ②次の試合の対戦カード演出
        // ③演出後、勝ち上がった試合の赤線だけ点滅
        const blinkAt = ADV_MS + (nextChanged? CARD_GAP+SP_MS : 0) + 200;
        setTimeout(()=> blinkBracketWins(ctx.noKey), blinkAt);
      } else if(nextChanged){
        spotlightForKey(nk, '次の試合');
      }

    } else toast('送信に失敗'+(res&&res.error?'：'+res.error:''), true);
  }).catch(err=> toast('送信に失敗: '+((err&&err.message)||err||''), true));
}

/* 進出ノードのポップ演出（試合(mr,mj)の勝者枠＝ノード(mr,mj)） */
function animateAdvance(t, mr, mj){
  const node=document.querySelector(`.runwin[data-tid="${t.id}"][data-r="${mr}"][data-j="${mj}"]`);
  if(node){ node.classList.remove('advance'); void node.offsetWidth; node.classList.add('advance'); }

/* ===== 簡易ストップウォッチ ===== */
const stopwatch={running:false, t0:0, base:0, timer:null};
function fmtTime(sec){ const m=Math.floor(sec/60), s=Math.floor(sec%60); return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
/* "mm:ss" または秒数文字列を秒に変換 */
function parseTime(str){
  if(!str) return 0;
  const m=String(str).trim().match(/^(\d+):([0-5]?\d)$/);
  if(m) return (+m[1])*60 + (+m[2]);
  const s=parseFloat(str); return isNaN(s)?0:Math.max(0,s);
}
function toggleStopwatch(){ stopwatch.running?stopStopwatch():startStopwatch(); }
function startStopwatch(){
  const tin0=document.getElementById('pendTime');
  stopwatch.base=parseTime(tin0 && tin0.value);   // 編集後の表示値の続きからカウントアップ
  stopwatch.running=true; stopwatch.t0=Date.now();
  stopwatch.timer=setInterval(()=>{
    const sec=stopwatch.base+(Date.now()-stopwatch.t0)/1000;
    const tin=document.getElementById('pendTime'); if(tin){ tin.value=fmtTime(sec); if(state.pending) state.pending.time=tin.value; }
  }, 500);
  const sw=document.getElementById('swBtn'); if(sw) sw.textContent='停止';
}
function stopStopwatch(){
  if(!stopwatch.running){ return; }
  stopwatch.base += (Date.now()-stopwatch.t0)/1000; stopwatch.running=false;
  clearInterval(stopwatch.timer);
  const sw=document.getElementById('swBtn'); if(sw) sw.textContent='計測';
}

/* ============================================================
 *  名前リスト / 配置
 * ============================================================ */
/* 「選手名（所属）」形式を解釈。全角/半角カッコ対応。 */
function parsePlayerLine(line){
  const m = line.match(/^(.*?)\s*[（(]\s*(.*?)\s*[)）]\s*$/);
  if(m) return { playerName:m[1].trim(), affiliation:m[2].trim() };
  return { playerName:line };
}
/* 出場可能な空き枠数（不戦枠を除き、選手名が未入力の枠）。 */
function emptySlotCount(t){
  let n=0;
  t.slots.forEach((s,i)=>{ if(!isHiddenBySeed(t,i) && !(s.player && s.player.playerName)) n++; });
  return n;
}
/* 全トーナメントの「埋められる枠」を上から順に列挙（不戦枠は除外）。 */
function fillableSlots(){
  return fillableSlotInfos().map(info=> info.slot);
}
/* 埋められる枠を {t, idx, slot} 付きで列挙。 */
function fillableSlotInfos(){
  const out=[];
  state.tournaments.forEach(t=>{
    t.slots.forEach((slot,i)=>{ if(!isHiddenBySeed(t,i)) out.push({t, idx:i, slot}); });
  });
  return out;
}
/* 同じ所属が初戦（同一ペア）で当たらないように貪欲に割り当て。
 *  ペアの2枠目を埋めるとき、相手と同じ所属の選手を避ける。 */
function assignAvoidingSameAff(players, infos){
  const pool=players.slice(); let placed=0;
  infos.forEach(info=>{
    if(!pool.length) return;
    let forbidden=null;
    const partnerIdx = info.idx ^ 1;
    if(!isHiddenBySeed(info.t, partnerIdx)){                 // 相手が不戦でなければ初戦が成立
      const partner=info.t.slots[partnerIdx];
      if(partner.player && partner.player.affiliation) forbidden=partner.player.affiliation;
    }
    let pick=0;
    if(forbidden){ const k=pool.findIndex(p=> (p.affiliation||'')!==forbidden); if(k>=0) pick=k; }
    info.slot.player = pool.splice(pick,1)[0]; placed++;
  });
  return placed;
}
/* 配置に使う選手リストを得る。
 *  名前リスト欄がCSVのファイル名表示のままなら roster をそのまま使う。
 *  手入力されていれば各行を解析し、roster から番号・代表者・連絡先を補完。 */
function gatherPlayers(){
  const roster = state.roster || [];
  const text = document.getElementById('nameList').value.trim();
  if(roster.length && text===(state.rosterLabel||'')){
    return roster.map(p=>({...p}));                       // CSVそのまま
  }
  const find=(name,aff)=> roster.find(r=> r.playerName===name && (r.affiliation||'')===(aff||''))
                       || roster.find(r=> r.playerName===name);
  return document.getElementById('nameList').value
    .split('\n').map(s=>s.trim()).filter(Boolean)
    .map(line=>{ const base=parsePlayerLine(line); const m=find(base.playerName, base.affiliation);
                 return m ? {...m, ...base} : base; });
}
function fillNames(random){
  if(!confirmIfResults('配置をやり直すと入力済みの結果と矛盾します。続けますか？')) return;
  let players = gatherPlayers();
  if(random) players = shuffle(players);
  // 1トーナメントの枠数を超える分は次のトーナメントへまたいで配置
  const infos = fillableSlotInfos();
  let idx;
  if(random && state.config.avoidSameAff){
    idx = assignAvoidingSameAff(players, infos);
    resolveSameAffClashes();                       // 入れ替えで初戦の同所属をできる限り解消
    // 回避しきれず同所属が残っていないか確認
    const clashes = countFirstRoundClashes();
    const ov = players.length - idx;
    toast(`読込${players.length}名・配置${idx}` + (ov>0?`・あふれ${ov}`:'') + (clashes>0?`・同所属の初戦${clashes}件`:'・同所属の初戦なし'), ov>0||clashes>0);
  } else {
    idx=0; infos.forEach(info=>{ if(idx<players.length) info.slot.player=players[idx++]; });
    const ov = players.length - idx;
    toast(`読込${players.length}名・配置${idx}` + (ov>0?`・あふれ${ov}`:''), ov>0);
  }
  renderAll();
}
/* 初戦の同所属衝突を、配置済み選手の入れ替えで解消する（山登り）。 */
function resolveSameAffClashes(){
  const infos=fillableSlotInfos();                 // 不戦枠を除く配置可能枠
  const clashAt=(t,idx)=>{
    const pj=idx^1;
    if(isHiddenBySeed(t,idx)||isHiddenBySeed(t,pj)) return false;
    const a=t.slots[idx].player, b=t.slots[pj].player;
    return !!(a&&b&&a.affiliation&&b.affiliation&&a.affiliation===b.affiliation);
  };
  let changed=true, guard=0;
  while(changed && guard++<300){
    changed=false;
    for(const info of infos){
      if(!clashAt(info.t,info.idx)) continue;
      for(const other of infos){
        if(other===info) continue;
        const s1=info.t.slots[info.idx], s2=other.t.slots[other.idx];
        [s1.player,s2.player]=[s2.player,s1.player];                       // 仮入れ替え
        if(!clashAt(info.t,info.idx) && !clashAt(other.t,other.idx)){ changed=true; break; }  // 両ペアとも解消
        [s1.player,s2.player]=[s2.player,s1.player];                       // 戻す
      }
      if(changed) break;
    }
  }
}
/* 初戦（同一ペアが両者出場）で同所属が当たっている件数 */
function countFirstRoundClashes(){
  let n=0;
  state.tournaments.forEach(t=>{
    for(let p=0;p*2<t.size;p++){
      const a=t.slots[p*2], b=t.slots[p*2+1];
      if(isHiddenBySeed(t,p*2)||isHiddenBySeed(t,p*2+1)) continue;
      const aa=a.player&&a.player.affiliation, ba=b.player&&b.player.affiliation;
      if(aa && ba && aa===ba) n++;
    }
  });
  return n;
}
function shuffleAssign(){
  // 全トーナメント横断で既存選手をシャッフル再配置
  const players = [];
  state.tournaments.forEach(t=> t.slots.forEach(s=>{ if(s.player) players.push(s.player); }));
  const shuffled = shuffle(players.slice());
  let idx=0;
  fillableSlots().forEach(slot=>{ slot.player = idx<shuffled.length ? shuffled[idx++] : null; });
  toast('配置をシャッフルしました');
  renderAll();
}

/* ===== CSV読込 ===== */
function importCsvFile(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.csv,text/csv';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=> applyCsv(decodeCsvBuffer(rd.result), f.name); rd.readAsArrayBuffer(f); };
  inp.click();
}
/* UTF-8で読み、化けたら Shift_JIS で読み直す（Excel CSV対応） */
function decodeCsvBuffer(buf){
  let txt=new TextDecoder('utf-8').decode(buf);
  if(txt.includes('�')){ try{ txt=new TextDecoder('shift_jis').decode(buf); }catch(e){} }
  return txt.replace(/^﻿/,'');
}
/* 引用符・カンマ・改行に対応した簡易CSVパーサ */
function parseCsv(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"'; i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===',') { row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(c!=='\r') cur+=c;
  }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=> r.some(x=> x.trim()!==''));
}
function applyCsv(text, fileName){
  const rows=parseCsv(text);
  if(!rows.length){ toast('CSVが空です', true); return; }
  const HEAD={ name:['選手名','名前','ロボット名','氏名'], aff:['所属','チーム','チーム名'],
               num:['番号','No','no','ナンバー','ゼッケン'], rep:['代表者名','代表者','操縦者','操縦者名'],
               contact:['連絡先','メール','mail','電話','TEL','tel'] };
  const first=rows[0].map(s=>s.trim());
  const idxOf=(keys)=> first.findIndex(h=> keys.includes(h));
  const ci={ name:idxOf(HEAD.name), aff:idxOf(HEAD.aff), num:idxOf(HEAD.num), rep:idxOf(HEAD.rep), contact:idxOf(HEAD.contact) };
  const hasHeader = Object.values(ci).some(v=> v>=0);
  const map = hasHeader ? ci : { name:0, aff:1, num:-1, rep:-1, contact:-1 };
  const dataRows = hasHeader ? rows.slice(1) : rows;
  const get=(r,i)=> (i>=0 && i<r.length) ? r[i].trim() : '';
  const players = dataRows.map(r=>{
    let name=get(r,map.name), aff=get(r,map.aff);
    if(!aff && name){ const m=name.match(/^(.*?)\s*[（(]\s*(.*?)\s*[)）]\s*$/); if(m){ name=m[1].trim(); aff=m[2].trim(); } }
    const p={playerName:name};
    if(aff) p.affiliation=aff;
    const num=get(r,map.num); if(num) p.number=num;
    const rep=get(r,map.rep); if(rep) p.representative=rep;
    const ct=get(r,map.contact); if(ct) p.contact=ct;
    return p;
  }).filter(p=> p.playerName);
  if(!players.length){ toast('選手名の列が読めませんでした', true); return; }
  if(!confirmIfResults('CSVを読み込むと現在の配置・結果がすべて置き換わります。続けますか？')) return;
  state.tournaments.forEach(t=> t.results={});                 // 結果をクリア（CSVは総入れ替え）
  state.repLeague={}; state.skipped={}; state.priority=[]; if(state.repT) state.repT.results={};
  // マスター（番号・代表者・連絡先まで保持）。名前リスト欄にはファイル名を表示。
  state.roster = players.map(p=>({...p}));
  state.rosterLabel = fileName || 'CSV';
  document.getElementById('nameList').value = state.rosterLabel;
  // 読み込んだ人数で選手数を更新し、基本サイズ・シード枠数を自動算出して作り直す
  document.getElementById('cfgPlayers').value = players.length;
  recalcFromPlayers();      // サイズ・シード枠数を自動算出
  commitBuild();            // 適正サイズで枠を用意（再描画）
  fillNames(true);          // ランダム配置（同所属回避はデフォルトON、番号等もroster補完）
}

async function doSave(){

  }catch(err){ toast('保存失敗: '+((err&&err.message)||err||''), true); }
}
/* 読み込んだデータの書式バージョンを確認して移行。戻り値=ユーザー向けメッセージ。 */
function loadParsed(obj){
  const v = obj.version;
  if(typeof v==='number' && v>SCHEMA_VERSION){
    return {ok:false, msg:`このデータは新しい書式(v${v})です。アプリを更新してください。`};
  }
  state = obj;
  normalizeState();                               // 不足項目を補完し version を更新
  return {ok:true, msg: (v===undefined) ? `旧書式を読み込み・移行しました` :
                        (v<SCHEMA_VERSION) ? `書式v${v}→v${SCHEMA_VERSION}に移行しました` : `読み込みました`};
}
async function doLoad(){
  if(!confirmIfResults('読み込むと現在の入力済み結果が置き換わります。続けますか？')) return;
  const key = document.getElementById('docKey').value || 'default';
  let r; try{ r = await Backend.load(key); }catch(err){ toast('読込失敗: '+((err&&err.message)||err||''), true); return; }
  if(r && r.ok && r.json){
    let obj; try{ obj=JSON.parse(r.json); }catch(e){ toast('JSON解析に失敗', true); return; }
    const res=loadParsed(obj);
    if(!res.ok){ toast(res.msg, true); return; }
    markSaved(); syncConfigInputs(); renderAll(); toast(res.msg);
  } else toast('該当データなし', true);
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* 入力済みの結果が1件でもあるか（致命的変更の確認用） */
function hasAnyResults(){
  if((state.tournaments||[]).some(t=> t.results && Object.keys(t.results).length)) return true;
  if(state.repLeague && Object.keys(state.repLeague).length) return true;
  if(state.repT && state.repT.results && Object.keys(state.repT.results).length) return true;
  return false;
}
/* 結果がある場合のみ確認。OK/結果なし→true、キャンセル→false */
function confirmIfResults(msg){ return !hasAnyResults() || confirm(msg); }
/* 旧フォーマット（色キー文字列・パレット無し）を現行（インデックス）へ移行 */
function normalizeState(){
  if(!state.config) state.config={};
  if(!Array.isArray(state.config.palette)) state.config.palette = clonePalette();
  if(!Array.isArray(state.roster)) state.roster = [];
  const defs={zoom:1, showAff:false, showNumber:false, showSeed:false, lineColor:'#33404f', autoSave:false,
              theme:'light', playerSize:'中', otherSize:'なし', recordTime:false, repMode:'tournament', hideByes:true,
              avoidSameAff:true, showMatchNo:false, centerStyle:false, winLineColor:'#e23b3b', eventName:''};
  for(const k in defs){ if(state.config[k]===undefined) state.config[k]=defs[k]; }
  // 3位決定戦：あり/なしの真偽値に統一（旧文字列 'none'→false / その他→true）
  if(typeof state.config.third==='string') state.config.third = (state.config.third!=='none');
  state.config.third = !!state.config.third;
  // 試合順：旧値を新値へ（byRound/seedLast→block、interleave→sequential）
  const ordMap={byRound:'block', seedLast:'block', interleave:'sequential', block:'block', sequential:'sequential'};
  state.config.order = ordMap[state.config.order] || 'block';
  if(typeof state.rosterLabel!=='string') state.rosterLabel='';
  if(!state.repLeague || typeof state.repLeague!=='object') state.repLeague={};
  if(!state.skipped || typeof state.skipped!=='object') state.skipped={};
  if(!Array.isArray(state.priority)) state.priority=[];
  const keyMap={red:0,blue:1,green:2,yellow:3,white:4,black:5};
  (state.tournaments||[]).forEach((t,i)=>{
    if(typeof t.colorTop==='string')    t.colorTop = keyMap[t.colorTop] ?? 0;
    if(typeof t.colorBottom==='string') t.colorBottom = keyMap[t.colorBottom] ?? 1;
    if(t.colorTop==null) t.colorTop=0;
    if(t.colorBottom==null) t.colorBottom=1;
    if(!t.results) t.results={};
    if(/^T\d+$/.test(t.name||'')) t.name=blockName(i+1);   // 旧デフォルト名T1等→Aブロック等に統一
  });
  state.version = SCHEMA_VERSION;
}

/* 選手数とトーナメント数から 基本サイズ・シード枠数 を算出して入力欄へ反映。 */
function recalcFromPlayers(){
  const n = parseInt(document.getElementById('cfgPlayers').value,10);
  if(!n || n<1) return;
  const count = +document.getElementById('cfgCount').value;
  const size = sizeForPer(Math.ceil(n/count));
  const seed = Math.max(0, count*size - n);     // 空き枠ぶんがシード（不戦勝）になる
  document.getElementById('cfgSize').value = size;
  document.getElementById('cfgSeed').value = seed;
}

/* シードを散らす順序（ビット反転＝標準シード配置）。
 *  ペアを「上端→下半分の先頭→…」の順で埋め、シード同士が当たるのを最も遅らせる。 */
function seedOrderPairs(P){
  const bits=Math.round(Math.log2(P)); const res=[];
  for(let i=0;i<P;i++){ let r=0,x=i; for(let b=0;b<bits;b++){ r=(r<<1)|(x&1); x>>=1; } res.push(r); }
  return res;
}
function isPairSeeded(t,p){ return t.slots[p*2].seed==='seed' || t.slots[p*2+1].seed==='seed'; }

/* 合計シード枠数を全トーナメントへ均等配分し、ペアの上枠をシード指定。
 *  そのうえでシード同士が次戦で当たる場合は2個目を下枠へ寄せる。 */
function applySeeds(total){
  state.tournaments.forEach(t=> t.slots.forEach(s=> s.seed='normal'));
  if(total<=0) return;
  const orders = state.tournaments.map(t=> seedOrderPairs(t.size/2));   // 埋めるペアの順序
  const ptr = state.tournaments.map(()=>0);
  let remaining=total, progressed=true;
  while(remaining>0 && progressed){
    progressed=false;
    for(let ti=0; ti<state.tournaments.length && remaining>0; ti++){
      if(ptr[ti] < orders[ti].length){
        const pairIdx = orders[ti][ptr[ti]++];
        state.tournaments[ti].slots[pairIdx*2].seed='seed';   // まず上枠に付与
        remaining--; progressed=true;
      }
    }
  }
  state.tournaments.forEach(flipAdjacentSeeds);
}

/* シード同士が次戦で当たるペア（兄弟ペアが両方シード）の、2個目を下枠へ移す。
 *  例: ロボA vs シード / シード vs ロボB の並びにする。 */
function flipAdjacentSeeds(t){
  const pairs = t.size/2;
  for(let p=1; p<pairs; p+=2){                 // 奇数ペア=兄弟の2番目
    if(isPairSeeded(t,p) && isPairSeeded(t,p-1) && t.slots[p*2].seed==='seed'){
      t.slots[p*2].seed='normal';
      t.slots[p*2+1].seed='seed';
    }
  }
}

    state.config.theme = (state.config.theme==='dark') ? 'light' : 'dark'; applyTheme();
  };
  document.getElementById('cfgAvoidSameAff').onchange=(e)=>{ state.config.avoidSameAff=e.target.checked; };

  document.getElementById('btnSave').onclick=doSave;
  document.getElementById('btnLoad').onclick=doLoad;
  document.getElementById('btnExport').onclick=doExport;
  document.getElementById('btnImport').onclick=doImport;
  document.getElementById('btnViewMode').onclick=enterViewMode;        // 管理者→閲覧プレビュー
  document.querySelector('.topbar h1').onclick=secretTap;              // 秘密のアンロック（トリプルクリック）
  document.getElementById('secretSpot').onclick=secretTap;             // 閲覧時の秘密アンロック

  document.getElementById('spClose').onclick=()=> document.getElementById('spotlight').classList.remove('show');
  document.getElementById('spotlight').onclick=(e)=>{ if(e.target.id==='spotlight') e.currentTarget.classList.remove('show'); };

  // 設定（折りたたみ）
  document.getElementById('btnSettings').onclick=()=>{
    const p=document.getElementById('settingsPanel'); p.hidden=!p.hidden;
  };
  document.getElementById('setZoom').onchange=(e)=>{ state.config.zoom=+e.target.value; renderBracket(); };
  document.getElementById('setShowAff').onchange=(e)=>{ state.config.showAff=e.target.checked; renderBracket(); };
  document.getElementById('setShowNumber').onchange=(e)=>{ state.config.showNumber=e.target.checked; renderBracket(); };
  document.getElementById('setShowSeed').onchange=(e)=>{ state.config.showSeed=e.target.checked; renderBracket(); };
  document.getElementById('setTheme').onchange=(e)=>{ state.config.theme=e.target.value; applyTheme(); };
  document.getElementById('setPlayerSize').onchange=(e)=>{ state.config.playerSize=e.target.value; renderBracket(); };
  document.getElementById('setOtherSize').onchange=(e)=>{ state.config.otherSize=e.target.value; renderBracket(); };
  document.getElementById('setLineColor').oninput=(e)=>{ state.config.lineColor=e.target.value; renderBracket(); };
  document.getElementById('setWinLineColor').oninput=(e)=>{ state.config.winLineColor=e.target.value; renderBracket(); };

  updatePhaseUI();
  renderAll();
  if(typeof DEMO_CSV==='string' && DEMO_CSV.trim()){        // ★デモ用：起動時にサンプルCSVを読込（不要なら DEMO_CSV を空に）
    applyCsv(DEMO_CSV, 'kawarobo_entry_list_large.csv');
  }
  markSaved();                              // 初期状態を「保存済み」基準に
  window.addEventListener('beforeunload', (e)=>{
    if(!viewMode && isDirty()){ e.preventDefault(); e.returnValue=''; }   // 管理者で未保存なら警告（閲覧は警告しない）
  });
  setupPinch();                             // スマホのピンチで表示倍率変更
  applyViewMode();                          // UIを隠し自動更新を開始（閲覧の初回は読込中表示）
  initialLoad();                            // 起動直後に保存docを取得して描画（素のちらつき防止）
}

/* スマホのピンチイン/アウトで表示倍率(zoom)を変更。 */
function setupPinch(){
  const stage=document.getElementById('stage'); if(!stage) return;
  let d0=0, z0=1, pinching=false;
  const dist=(t)=> Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  stage.addEventListener('touchstart',(e)=>{ if(e.touches.length===2){ pinching=true; d0=dist(e.touches)||1; z0=state.config.zoom||1; } },{passive:false});
  stage.addEventListener('touchmove',(e)=>{
    if(pinching && e.touches.length===2){ e.preventDefault();
      const z=Math.max(0.4, Math.min(2, z0*dist(e.touches)/d0));
      state.config.zoom=z; const inner=document.getElementById('stageInner'); if(inner) inner.style.zoom=z;
    }
  },{passive:false});
  const end=()=>{ if(pinching){ pinching=false;
    const sel=document.getElementById('setZoom'); if(sel) sel.value=state.config.zoom; renderBracket(); } };
  stage.addEventListener('touchend', end); stage.addEventListener('touchcancel', end);
}

/* 自動保存（デバウンス）。renderAll の最後から呼ぶ。 */
let autoSaveTimer;
function scheduleAutoSave(){
  if(!state.config || !state.config.autoSave) return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer=setTimeout(()=>{
    const key=document.getElementById('docKey').value || 'default';
    Backend.save(key, JSON.stringify(state)).then(()=> markSaved());
  }, 900);
}
window.addEventListener('DOMContentLoaded', init);
</script>
